<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZKqgVjym7mhISgQOL0c5tkEnyOoiRBUyUfg&s" sizes="16×16" type="image/png" /> 
    <style>
        body {
            font-family: 'Calibri', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        #editor-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #ffffff;
            box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1);
        }
        #toolbar {
    background-color: #f1f1f1;
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
}

#toolbar button,
#toolbar select,
#toolbar input[type="color"] {
    flex-shrink: 0;
}
        #toolbar button {
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        #toolbar button:hover {
            background-color: #e0e0e0;
        }
        #toolbar select, #toolbar input[type="color"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        #editor {
            flex-grow: 1;
            padding: 20px;
            margin: 10px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            height: 100%;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.3; /* 行間を狭く設定 */
            border-radius: 4px;
        }
        #editor p {
            margin: 0;
            padding: 5px 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div id="editor-container">
    <!-- Toolbar -->
    <div id="toolbar">
        <!-- Text Formatting Tools -->
        <button onclick="document.execCommand('bold')"><b>B</b></button>
        <button onclick="document.execCommand('italic')"><i>I</i></button>
        <button onclick="document.execCommand('underline')"><u>U</u></button>
        <button onclick="document.execCommand('fontSize', false, 5)">A+</button>
        <button onclick="document.execCommand('fontSize', false, 1)">A-</button>
        <button onclick="document.execCommand('foreColor', false, document.getElementById('textColor').value)">Text Color</button>
        <input type="color" id="textColor">
        <select onchange="changeFontFamily(this)">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
        </select>
        
        <!-- Paragraph Tools -->
        <button onclick="document.execCommand('insertOrderedList')">Numbered List</button>
        <button onclick="document.execCommand('insertUnorderedList')">Bullet List</button>
        <button onclick="document.execCommand('justifyCenter')">Center</button>
        <button onclick="document.execCommand('justifyLeft')">Left</button>
        <button onclick="document.execCommand('justifyRight')">Right</button>

        <!-- Insert Tools -->
        <button onclick="insertImage()">Insert Image</button>
        <button onclick="insertLink()">Insert Link</button>
        <button onclick="insertTable()">Insert Table</button>

        <!-- File Handling -->
        <button onclick="saveDocument()">Save</button>
        <button onclick="loadDocument()">Load</button>
        <button onclick="clearEditor()">Clear</button>

        <!-- Undo/Redo -->
        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>

        <!-- File Upload -->
        <input type="file" id="fileInput" onchange="loadFromFile()" class="hidden">
        <button onclick="document.getElementById('fileInput').click()">Upload File</button>
    </div>

    <!-- Editor -->
    <div id="editor" contenteditable="true">
        <p><!--ここにテキストを入力してください...--></p>
    </div>
</div>

<script>
    let undoStack = [];
    let redoStack = [];

    // Save the document content to localStorage
    function saveDocument() {
        const content = document.getElementById('editor').innerHTML;
        localStorage.setItem('documentContent', content);
        alert('Document saved successfully!');
    }

    // Load the document content from localStorage
    function loadDocument() {
        const savedContent = localStorage.getItem('documentContent');
        if (savedContent) {
            document.getElementById('editor').innerHTML = savedContent;
        } else {
            alert('No document found!');
        }
    }

    // Insert an image into the editor
    function insertImage() {
        const imageUrl = prompt("Enter the image URL:");
        if (imageUrl) {
            const img = `<img src="${imageUrl}" alt="Image" style="max-width: 100%; height: auto;">`;
            document.execCommand('insertHTML', false, img);
        }
    }

    // Insert a link into the editor
    function insertLink() {
        const linkUrl = prompt("Enter the link URL:");
        if (linkUrl) {
            const linkText = prompt("Enter the link text:");
            if (linkText) {
                const link = `<a href="${linkUrl}" target="_blank">${linkText}</a>`;
                document.execCommand('insertHTML', false, link);
            }
        }
    }

    // Insert a table into the editor
    function insertTable() {
        const rows = prompt("Enter number of rows:");
        const cols = prompt("Enter number of columns:");
        let tableHTML = "<table border='1' style='width:100%; border-collapse: collapse;'>";
        for (let i = 0; i < rows; i++) {
            tableHTML += "<tr>";
            for (let j = 0; j < cols; j++) {
                tableHTML += "<td style='padding:10px;'>Cell</td>";
            }
            tableHTML += "</tr>";
        }
        tableHTML += "</table>";
        document.execCommand('insertHTML', false, tableHTML);
    }

    // Change the font family of the selected text
    function changeFontFamily(selectElement) {
        document.execCommand('fontName', false, selectElement.value);
    }

    // Clear the editor content
    function clearEditor() {
        document.getElementById('editor').innerHTML = '';
    }

    // Load content from uploaded file
    function loadFromFile() {
        const file = document.getElementById('fileInput').files[0];
        const reader = new FileReader();
        
        reader.onload = function(event) {
            document.getElementById('editor').innerHTML = event.target.result;
        };
        
        if (file) {
            reader.readAsText(file);
        }
    }

    // Undo function
    function undo() {
        const currentContent = document.getElementById('editor').innerHTML;
        if (undoStack.length > 0) {
            redoStack.push(currentContent);
            document.getElementById('editor').innerHTML = undoStack.pop();
        }
    }

    // Redo function
    function redo() {
        if (redoStack.length > 0) {
            const contentToRedo = redoStack.pop();
            undoStack.push(document.getElementById('editor').innerHTML);
            document.getElementById('editor').innerHTML = contentToRedo;
        }
    }

    // Save content before editing for undo functionality
    document.getElementById('editor').addEventListener('input', () => {
        undoStack.push(document.getElementById('editor').innerHTML);
        redoStack = [];  // Clear redo stack on new input
    });
</script>

</body>
</html>
