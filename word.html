<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZKqgVjym7mhISgQOL0c5tkEnyOoiRBUyUfg&s" sizes="16×16" type="image/png" /> 
    <style>
        body {
            font-family: 'Calibri', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        #editor-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #ffffff;
            box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1);
        }
        #toolbar {
    background-color: #f1f1f1;
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
}

#toolbar button,
#toolbar select,
#toolbar input[type="color"] {
    flex-shrink: 0;
}
        #toolbar button {
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        #toolbar button:hover {
            background-color: #e0e0e0;
        }
        #toolbar select, #toolbar input[type="color"] {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        #editor {
            flex-grow: 1;
            padding: 20px;
            margin: 10px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            height: 100%;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.3; /* 行間を狭く設定 */
            border-radius: 4px;
        }
        #editor p {
            margin: 0;
            padding: 5px 0;
        }
        .hidden {
            display: none;
        }
        #file-name-bar{
    height:38px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 12px;
    background:#f7f7f7;
    border-bottom:1px solid #ccc;
    flex-shrink:0;
}

#documentFileName{
    width:280px;
    height:26px;
    padding:4px 8px;
    border:1px solid #aaa;
    border-radius:4px;
    background:#fff;
}
    </style>
</head>
<body>

<div id="editor-container">
    <!-- Toolbar -->
    <div id="toolbar">
        <!-- Text Formatting Tools -->
        <button onclick="document.execCommand('bold')"><b>B</b></button>
        <button onclick="document.execCommand('italic')"><i>I</i></button>
        <button onclick="document.execCommand('underline')"><u>U</u></button>
        <button onclick="document.execCommand('fontSize', false, 5)">A+</button>
        <button onclick="document.execCommand('fontSize', false, 1)">A-</button>
        <button onclick="document.execCommand('foreColor', false, document.getElementById('textColor').value)">Text Color</button>
        <input type="color" id="textColor">
        <select onchange="changeFontFamily(this)">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
        </select>
        
        <!-- Paragraph Tools -->
        <button onclick="document.execCommand('insertOrderedList')">Numbered List</button>
        <button onclick="document.execCommand('insertUnorderedList')">Bullet List</button>
        <button onclick="document.execCommand('justifyCenter')">Center</button>
        <button onclick="document.execCommand('justifyLeft')">Left</button>
        <button onclick="document.execCommand('justifyRight')">Right</button>

        <!-- Insert Tools -->
        <button onclick="insertImage()">Insert Image</button>
        <button onclick="insertLink()">Insert Link</button>
        <button onclick="insertTable()">Insert Table</button>

        <!-- File Handling -->
<button onclick="saveDocument()">Save</button>
<button onclick="openWordFilePicker()">Open</button>
<button onclick="clearEditor()">Clear</button>

        <!-- Undo/Redo -->
        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>

        <!-- File Upload -->
        <input type="file" id="fileInput" onchange="loadFromFile()" class="hidden">
        <button onclick="document.getElementById('fileInput').click()">Upload File</button>
    </div>

    <!-- Editor -->
    <div id="editor" contenteditable="true">
        <p><!--ここにテキストを入力してください...--></p>
    </div>
    <div id="file-name-bar">
    <span>ファイル名：</span>
    <input id="documentFileName" value="新しい文書.word">
</div>
</div>

<script>
    const WORD_STORAGE_KEY = "webos10_files_v2";

let currentWordFilePath =
  new URLSearchParams(location.search).get("file");

function getWordFiles(){
  try{
    return JSON.parse(
      localStorage.getItem(WORD_STORAGE_KEY) || "{}"
    );
  }catch{
    return {};
  }
}

function saveWordToExplorer(){
  const editor = document.getElementById("editor");
  const files = getWordFiles();

  if(!currentWordFilePath){
    const name = prompt(
      "ファイル名を入力してください",
      "文書1.word"
    );

    if(!name) return;

    let filename = name.trim();

    if(!filename.toLowerCase().endsWith(".word")){
      filename += ".word";
    }

    currentWordFilePath =
      "Documents/" + filename;
  }

  const filename =
    currentWordFilePath.split("/").pop();

  files[currentWordFilePath] = {
    type: "file",
    name: filename,
    path: currentWordFilePath,
    extension: ".word",
    mime: "text/html",
    app: "word",
    content: editor.innerHTML,
    updatedAt: Date.now()
  };

  localStorage.setItem(
    WORD_STORAGE_KEY,
    JSON.stringify(files)
  );

  localStorage.setItem(
    "documentContent",
    editor.innerHTML
  );

  window.parent.postMessage({
    type: "webos-file-saved",
    path: currentWordFilePath,
    app: "word",
    file: files[currentWordFilePath]
  }, "*");

  alert("Explorerに保存しました");
}
    let undoStack = [];
    let redoStack = [];

    // Save the document content to localStorage
    function saveDocument() {
        const content = document.getElementById('editor').innerHTML;
        localStorage.setItem('documentContent', content);
        alert('Document saved successfully!');
    }

    // Load the document content from localStorage
    function loadDocument() {
        const savedContent = localStorage.getItem('documentContent');
        if (savedContent) {
            document.getElementById('editor').innerHTML = savedContent;
        } else {
            alert('No document found!');
        }
    }

    // Insert an image into the editor
    function insertImage() {
        const imageUrl = prompt("Enter the image URL:");
        if (imageUrl) {
            const img = `<img src="${imageUrl}" alt="Image" style="max-width: 100%; height: auto;">`;
            document.execCommand('insertHTML', false, img);
        }
    }

    // Insert a link into the editor
    function insertLink() {
        const linkUrl = prompt("Enter the link URL:");
        if (linkUrl) {
            const linkText = prompt("Enter the link text:");
            if (linkText) {
                const link = `<a href="${linkUrl}" target="_blank">${linkText}</a>`;
                document.execCommand('insertHTML', false, link);
            }
        }
    }

    // Insert a table into the editor
    function insertTable() {
        const rows = prompt("Enter number of rows:");
        const cols = prompt("Enter number of columns:");
        let tableHTML = "<table border='1' style='width:100%; border-collapse: collapse;'>";
        for (let i = 0; i < rows; i++) {
            tableHTML += "<tr>";
            for (let j = 0; j < cols; j++) {
                tableHTML += "<td style='padding:10px;'>Cell</td>";
            }
            tableHTML += "</tr>";
        }
        tableHTML += "</table>";
        document.execCommand('insertHTML', false, tableHTML);
    }

    // Change the font family of the selected text
    function changeFontFamily(selectElement) {
        document.execCommand('fontName', false, selectElement.value);
    }

    // Clear the editor content
    function clearEditor() {
        document.getElementById('editor').innerHTML = '';
    }

    // Load content from uploaded file
    function loadFromFile() {
        const file = document.getElementById('fileInput').files[0];
        const reader = new FileReader();
        
        reader.onload = function(event) {
            document.getElementById('editor').innerHTML = event.target.result;
        };
        
        if (file) {
            reader.readAsText(file);
        }
    }

    // Undo function
    function undo() {
        const currentContent = document.getElementById('editor').innerHTML;
        if (undoStack.length > 0) {
            redoStack.push(currentContent);
            document.getElementById('editor').innerHTML = undoStack.pop();
        }
    }

    // Redo function
    function redo() {
        if (redoStack.length > 0) {
            const contentToRedo = redoStack.pop();
            undoStack.push(document.getElementById('editor').innerHTML);
            document.getElementById('editor').innerHTML = contentToRedo;
        }
    }
/* ========================================
   Windows 11 共通ファイルシステム
======================================== */

const WORD_FILES_KEY = "windows11_files";

function getWindowsFiles(){
    try{
        return JSON.parse(
            localStorage.getItem(WORD_FILES_KEY) || "{}"
        );
    }catch(e){
        return {};
    }
}

function saveWindowsFiles(files){
    localStorage.setItem(
        WORD_FILES_KEY,
        JSON.stringify(files)
    );

    /*
     * Windows側で使っている可能性のある
     * files形式にも同期
     */
    try{
        localStorage.setItem(
            "files",
            JSON.stringify(files)
        );
    }catch(e){}
}

function normalizeWordFileName(name){
    name = String(name || "").trim();

    if(!name){
        name = "新しい文書";
    }

    /*
     * 拡張子がなければ .word を付ける
     */
    if(!/\.[a-z0-9]+$/i.test(name)){
        name += ".word";
    }

    return name;
}

function saveDocument(){

    const editor =
        document.getElementById("editor");

    const filenameInput =
        document.getElementById("documentFileName");

    const filename =
        normalizeWordFileName(
            filenameInput.value
        );

    filenameInput.value = filename;

    const path =
        currentWordFilePath ||
        ("Documents/" + filename);

    currentWordFilePath = path;

    const actualFilename =
        path.split("/").pop();

    const file = {
        type: "file",
        name: actualFilename,
        path: path,
        extension: ".word",
        mime: "text/html",
        app: "word",
        content: editor.innerHTML,
        updatedAt: Date.now()
    };

    // Word自身の保存
    const files = getWordFiles();
    files[path] = file;
    localStorage.setItem(
        WORD_STORAGE_KEY,
        JSON.stringify(files)
    );

    // 旧形式も互換用に残す
    localStorage.setItem(
        "documentContent",
        editor.innerHTML
    );
    localStorage.setItem(
        "word_current_file",
        path
    );

    // Windows親画面へファイル本体を渡す
    try {
        window.parent.postMessage({
            type: "webos-file-saved",
            path: path,
            app: "word",
            file: file
        }, "*");
    } catch(e) {}

    alert(
        "「" + actualFilename +
        "」をエクスプローラーに保存しました。"
    );
}

function loadDocument(){

    const files =
        getWindowsFiles();

    const filename =
        normalizeWordFileName(
            document.getElementById(
                "documentFileName"
            ).value
        );

    const path =
        "Documents/" + filename;

    const file =
        files[path];

    if(
        file &&
        file.type === "file" &&
        file.app === "word"
    ){

        document.getElementById(
            "editor"
        ).innerHTML =
            file.content || "";

        document.getElementById(
            "documentFileName"
        ).value =
            file.name || filename;

        localStorage.setItem(
            "word_current_file",
            path
        );

        return;
    }

    /*
     * 旧Wordデータとの互換
     */
    const oldContent =
        localStorage.getItem(
            "documentContent"
        );

    if(oldContent){

        document.getElementById(
            "editor"
        ).innerHTML =
            oldContent;

        return;
    }

    alert(
        "ファイルが見つかりません。"
    );
}
function openWordFileFromExplorer(path){

    const files =
        getWindowsFiles();

    const file =
        files[path];

    if(!file) return;

    if(
        file.app !== "word" &&
        file.extension !== ".word"
    ){
        return;
    }

    document.getElementById(
        "editor"
    ).innerHTML =
        file.content || "";

    document.getElementById(
        "documentFileName"
    ).value =
        file.name ||
        path.split("/").pop();

    localStorage.setItem(
        "word_current_file",
        path
    );
}
/* ========================================
   Word：Explorerからファイルを開く
======================================== */

function openWordFilePicker(){

    const files = getWindowsFiles();

    const wordFiles = Object.values(files).filter(file =>
        file &&
        file.type === "file" &&
        (
            file.app === "word" ||
            file.extension === ".word"
        )
    );

    if(wordFiles.length === 0){
        alert("ExplorerにWordファイルがありません。");
        return;
    }

    let message = "開くWordファイルを選択してください。\n\n";

    wordFiles.forEach((file, index) => {
        message +=
            (index + 1) + ". " +
            (file.name || file.path) +
            "\n";
    });

    const answer = prompt(
        message + "\n番号を入力してください。",
        "1"
    );

    if(answer === null) return;

    const index = parseInt(answer, 10) - 1;

    if(
        isNaN(index) ||
        index < 0 ||
        index >= wordFiles.length
    ){
        alert("無効な番号です。");
        return;
    }

    const file = wordFiles[index];

    document.getElementById("editor").innerHTML =
        file.content || "";

    document.getElementById("documentFileName").value =
        file.name ||
        file.path.split("/").pop();

    currentWordFilePath =
        file.path;

    localStorage.setItem(
        "word_current_file",
        file.path
    );

    localStorage.setItem(
        "documentContent",
        file.content || ""
    );
}
    // Save content before editing for undo functionality
    document.getElementById('editor').addEventListener('input', () => {
        undoStack.push(document.getElementById('editor').innerHTML);
        redoStack = [];  // Clear redo stack on new input
    });
function loadWordFromExplorer(){
  if(!currentWordFilePath) return;

  const files = getWordFiles();
  const item = files[currentWordFilePath];

  if(!item || item.type !== "file") return;

  document.getElementById("editor").innerHTML =
    item.content || "";

  localStorage.setItem(
    "documentContent",
    item.content || ""
  );
}

loadWordFromExplorer();
</script>

</body>
</html>
