/* ===== Microsoft Word inspired UI ===== */

<script>
    const WORD_STORAGE_KEY = "webos10_files_v2";

let currentWordFilePath =
  new URLSearchParams(location.search).get("file");

function getWordFiles(){
  try{
    return JSON.parse(
      localStorage.getItem(WORD_STORAGE_KEY) || "{}"
    );
  }catch{
    return {};
  }
}

function saveWordToExplorer(){
  const editor = document.getElementById("editor");
  const files = getWordFiles();

  if(!currentWordFilePath){
    const name = prompt(
      "ファイル名を入力してください",
      "文書1.word"
    );

    if(!name) return;

    let filename = name.trim();

    if(!filename.toLowerCase().endsWith(".word")){
      filename += ".word";
    }

    currentWordFilePath =
      "Documents/" + filename;
  }

  const filename =
    currentWordFilePath.split("/").pop();

  files[currentWordFilePath] = {
    type: "file",
    name: filename,
    path: currentWordFilePath,
    extension: ".word",
    mime: "text/html",
    app: "word",
    content: editor.innerHTML,
    updatedAt: Date.now()
  };

  localStorage.setItem(
    WORD_STORAGE_KEY,
    JSON.stringify(files)
  );

  localStorage.setItem(
    "documentContent",
    editor.innerHTML
  );

  window.parent.postMessage({
    type: "webos-file-saved",
    path: currentWordFilePath,
    app: "word",
    file: files[currentWordFilePath]
  }, "*");

  alert("Explorerに保存しました");
}
    let undoStack = [];
    let redoStack = [];

    // Save the document content to localStorage
    function saveDocument() {
        const content = document.getElementById('editor').innerHTML;
        localStorage.setItem('documentContent', content);
        alert('Document saved successfully!');
    }

    // Load the document content from localStorage
    function loadDocument() {
        const savedContent = localStorage.getItem('documentContent');
        if (savedContent) {
            document.getElementById('editor').innerHTML = savedContent;
        } else {
            alert('No document found!');
        }
    }

    // Insert an image into the editor
    let wordSavedRange = null;

    function rememberWordSelection(){
        const editor=document.getElementById("editor");
        const sel=window.getSelection();
        if(!sel || !sel.rangeCount || !editor.contains(sel.anchorNode)) return;
        wordSavedRange=sel.getRangeAt(0).cloneRange();
    }

    function restoreWordSelection(){
        const editor=document.getElementById("editor");
        editor.focus();
        const sel=window.getSelection();
        sel.removeAllRanges();
        if(wordSavedRange){
            try{ sel.addRange(wordSavedRange); return; }catch(e){}
        }
        const range=document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        sel.addRange(range);
    }

    function insertWordHTML(html){
        restoreWordSelection();
        document.execCommand("insertHTML",false,html);
        rememberWordSelection();
    }

    function insertImage(){
        rememberWordSelection();
        const url=prompt("画像URLを入力してください");
        if(!url) return;
        insertWordHTML('<img src="'+String(url).replace(/"/g,'&quot;')+'" alt="画像" style="max-width:100%;height:auto;display:block;margin:8px 0">');
    }

    function insertLink(){
        rememberWordSelection();
        const url=prompt("リンクURLを入力してください","https://");
        if(!url) return;
        const text=prompt("リンク文字列を入力してください","リンク");
        if(!text) return;
        insertWordHTML('<a href="'+String(url).replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+String(text).replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</a>');
    }

    function insertTable(){
        rememberWordSelection();
        const r=Math.max(1,Math.min(20,parseInt(prompt("行数","3"),10)||0));
        const c=Math.max(1,Math.min(12,parseInt(prompt("列数","3"),10)||0));
        let html='<table style="width:100%;border-collapse:collapse;margin:10px 0"><tbody>';
        for(let i=0;i<r;i++){
            html+='<tr>';
            for(let j=0;j<c;j++) html+='<td style="border:1px solid #aaa;padding:8px;min-width:50px">セル</td>';
            html+='</tr>';
        }
        html+='</tbody></table><p><br></p>';
        insertWordHTML(html);
    }

    // Change the font family of the selected text
    function changeFontFamily(selectElement) {
        document.execCommand('fontName', false, selectElement.value);
    }

    // Clear the editor content
    function clearEditor() {
        document.getElementById('editor').innerHTML = '';
    }

    // Load content from uploaded file
    function loadFromFile() {
        const file = document.getElementById('fileInput').files[0];
        const reader = new FileReader();
        
        reader.onload = function(event) {
            document.getElementById('editor').innerHTML = event.target.result;
        };
        
        if (file) {
            reader.readAsText(file);
        }
    }

    // Undo function
    function undo() {
        const currentContent = document.getElementById('editor').innerHTML;
        if (undoStack.length > 0) {
            redoStack.push(currentContent);
            document.getElementById('editor').innerHTML = undoStack.pop();
        }
    }

    // Redo function
    function redo() {
        if (redoStack.length > 0) {
            const contentToRedo = redoStack.pop();
            undoStack.push(document.getElementById('editor').innerHTML);
            document.getElementById('editor').innerHTML = contentToRedo;
        }
    }
/* ========================================
   Windows 11 共通ファイルシステム
======================================== */

const WORD_FILES_KEY = "webos10_files_v2";

function getWindowsFiles(){
    try{
        return JSON.parse(
            localStorage.getItem(WORD_FILES_KEY) || "{}"
        );
    }catch(e){
        return {};
    }
}

function saveWindowsFiles(files){
    localStorage.setItem(
        WORD_FILES_KEY,
        JSON.stringify(files)
    );
    localStorage.setItem(
        "webos10_files_v2",
        JSON.stringify(files)
    );

    /*
     * Windows側で使っている可能性のある
     * files形式にも同期
     */
    try{
        localStorage.setItem(
            "files",
            JSON.stringify(files)
        );
    }catch(e){}
}

function normalizeWordFileName(name){
    name = String(name || "").trim();

    if(!name){
        name = "新しい文書";
    }

    /*
     * 拡張子がなければ .word を付ける
     */
    if(!/\.[a-z0-9]+$/i.test(name)){
        name += ".word";
    }

    return name;
}

function saveDocument(){

    const editor =
        document.getElementById("editor");

    const filenameInput =
        document.getElementById("documentFileName");

    const filename =
        normalizeWordFileName(
            filenameInput.value
        );

    filenameInput.value = filename;

    const path =
        currentWordFilePath ||
        ("Documents/" + filename);

    currentWordFilePath = path;

    const actualFilename =
        path.split("/").pop();

    const file = {
        type: "file",
        name: actualFilename,
        path: path,
        extension: ".word",
        mime: "text/html",
        app: "word",
        content: editor.innerHTML,
        updatedAt: Date.now()
    };

    // Word自身の保存
    const files = getWordFiles();
    files[path] = file;
    localStorage.setItem(
        WORD_STORAGE_KEY,
        JSON.stringify(files)
    );

    // 旧形式も互換用に残す
    localStorage.setItem(
        "documentContent",
        editor.innerHTML
    );
    localStorage.setItem(
        "word_current_file",
        path
    );

    // Windows親画面へファイル本体を渡す
    try {
        window.parent.postMessage({
            type: "webos-file-saved",
            path: path,
            app: "word",
            file: file
        }, "*");
    } catch(e) {}

    alert(
        "「" + actualFilename +
        "」をエクスプローラーに保存しました。"
    );
}

function loadDocument(){

    const files =
        getWindowsFiles();

    const filename =
        normalizeWordFileName(
            document.getElementById(
                "documentFileName"
            ).value
        );

    const path =
        "Documents/" + filename;

    const file =
        files[path];

    if(
        file &&
        file.type === "file" &&
        file.app === "word"
    ){

        document.getElementById(
            "editor"
        ).innerHTML =
            file.content || "";

        document.getElementById(
            "documentFileName"
        ).value =
            file.name || filename;

        localStorage.setItem(
            "word_current_file",
            path
        );

        return;
    }

    /*
     * 旧Wordデータとの互換
     */
    const oldContent =
        localStorage.getItem(
            "documentContent"
        );

    if(oldContent){

        document.getElementById(
            "editor"
        ).innerHTML =
            oldContent;

        return;
    }

    alert(
        "ファイルが見つかりません。"
    );
}
function openWordFileFromExplorer(path){

    const files =
        getWindowsFiles();

    const file =
        files[path];

    if(!file) return;

    if(
        file.app !== "word" &&
        file.extension !== ".word"
    ){
        return;
    }

    document.getElementById(
        "editor"
    ).innerHTML =
        file.content || "";

    document.getElementById(
        "documentFileName"
    ).value =
        file.name ||
        path.split("/").pop();

    localStorage.setItem(
        "word_current_file",
        path
    );
}
/* ========================================
   Word：Explorerからファイルを開く
======================================== */

function openWordFilePicker(){

    const files = getWindowsFiles();

    const wordFiles = Object.values(files).filter(file =>
        file &&
        file.type === "file" &&
        (
            file.app === "word" ||
            file.extension === ".word"
        )
    );

    if(wordFiles.length === 0){
        alert("ExplorerにWordファイルがありません。");
        return;
    }

    let message = "開くWordファイルを選択してください。\n\n";

    wordFiles.forEach((file, index) => {
        message +=
            (index + 1) + ". " +
            (file.name || file.path) +
            "\n";
    });

    const answer = prompt(
        message + "\n番号を入力してください。",
        "1"
    );

    if(answer === null) return;

    const index = parseInt(answer, 10) - 1;

    if(
        isNaN(index) ||
        index < 0 ||
        index >= wordFiles.length
    ){
        alert("無効な番号です。");
        return;
    }

    const file = wordFiles[index];

    document.getElementById("editor").innerHTML =
        file.content || "";

    document.getElementById("documentFileName").value =
        file.name ||
        file.path.split("/").pop();

    currentWordFilePath =
        file.path;

    localStorage.setItem(
        "word_current_file",
        file.path
    );

    localStorage.setItem(
        "documentContent",
        file.content || ""
    );
}
    document.getElementById("editor").addEventListener("mouseup", rememberWordSelection);
    document.getElementById("editor").addEventListener("keyup", rememberWordSelection);

    // Save content before editing for undo functionality
    document.getElementById('editor').addEventListener('input', () => {
        undoStack.push(document.getElementById('editor').innerHTML);
        redoStack = [];  // Clear redo stack on new input
    });
function loadWordFromExplorer(){
  if(!currentWordFilePath) return;

  const files = getWordFiles();
  const item = files[currentWordFilePath];

  if(!item || item.type !== "file") return;

  document.getElementById("editor").innerHTML =
    item.content || "";

  localStorage.setItem(
    "documentContent",
    item.content || ""
  );
}

loadWordFromExplorer();

// ==============================
// Word リボンと追加機能
// ==============================
(function(){
  const tabs=document.querySelectorAll('#wordTabs span');
  const panels=document.querySelectorAll('.word-ribbon-panel');
  tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      panels.forEach(p=>p.classList.remove('active'));
      tab.classList.add('active');
      const panel=document.getElementById(tab.dataset.panel);
      if(panel) panel.classList.add('active');
    });
  });
})();
function insertPageBreak(){insertWordHTML('<div style="page-break-after:always;height:1px"></div><p><br></p>');}
function insertHorizontalLine(){insertWordHTML('<hr>');}
function insertDate(){rememberWordSelection();restoreWordSelection();document.execCommand('insertText',false,new Date().toLocaleDateString('ja-JP'));}
function insertTime(){rememberWordSelection();restoreWordSelection();document.execCommand('insertText',false,new Date().toLocaleTimeString('ja-JP'));}
function setEditorAlign(v){document.execCommand('justify'+v.charAt(0).toUpperCase()+v.slice(1));}
function setEditorBackground(v){document.getElementById('editor').style.background=v;}
function setEditorPadding(v){const e=document.getElementById('editor');e.style.padding=v==='compact'?'40px 55px':v==='wide'?'90px 110px':'70px 80px';}
function insertTableOfContents(){document.execCommand('insertHTML',false,'<div><b>目次</b><br>1. はじめに<br>2. 本文<br>3. まとめ</div>');}
function insertFootnote(){document.execCommand('insertHTML',false,'<sup>[1]</sup>');}
function spellCheckSimple(){alert('簡易スペル確認を実行しました。');}
function toggleWordPageShadow(){const e=document.getElementById('editor');e.style.boxShadow=e.style.boxShadow?'none':'0 1px 6px #00000029';}
function insertEmoji(){rememberWordSelection();const v=prompt('記号を入力','★');if(v){restoreWordSelection();document.execCommand('insertText',false,v);}}
function setEditorTextColor(){const v=prompt('ページ文字色','#222222');if(v)document.getElementById('editor').style.color=v;}
function setEditorLineHeight(v){document.getElementById('editor').style.lineHeight=v;}
function setEditorWidth(v){const e=document.getElementById('editor');e.style.width=v==='narrow'?'700px':v==='wide'?'1050px':'900px';}
function toggleEditorColumns(){const e=document.getElementById('editor');e.style.columnCount=e.style.columnCount==='2'?'1':'2';e.style.columnGap='40px';}
function insertHeading(text){document.execCommand('formatBlock',false,'h2');document.execCommand('insertText',false,text);}
function insertPageNumber(){document.execCommand('insertText',false,'ページ '+(document.querySelectorAll('#editor *').length+1));}
function wordCount(){const t=document.getElementById('editor').innerText.trim();alert('文字数: '+t.length+'\n単語数: '+(t?t.split(/\s+/).length:0));}
function findWord(){const q=prompt('検索する文字');if(!q)return;const t=document.getElementById('editor').innerText;alert(t.includes(q)?'見つかりました':'見つかりませんでした');}
function replaceWord(){const a=prompt('検索する文字');if(a===null||!a)return;const b=prompt('置換後の文字','');if(b===null)return;const e=document.getElementById('editor');e.innerHTML=e.innerHTML.split(a).join(b);}
function setWordZoom(){const z=parseInt(prompt('ズーム（50〜150）','100'));if(isNaN(z))return;document.getElementById('editor').style.zoom=Math.max(50,Math.min(150,z))/100;}
function toggleWordFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
function toggleWordRuler(){const id='word-ruler';let r=document.getElementById(id);if(r){r.remove();return;}r=document.createElement('div');r.id=id;r.textContent='0    1    2    3    4    5    6    7';r.style.cssText='height:24px;background:#eee;border-bottom:1px solid #ccc;padding:3px 40px;font:12px monospace;color:#666;';document.getElementById('editor-container').insertBefore(r,document.getElementById('editor'));}
</script>

</body>
</html>
