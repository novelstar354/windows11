<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebOS 10</title>
<link rel="icon" href="windows.png" sizes="16x16" type="image/png" />  
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;user-select: none;-webkit-user-select: none;}
body{background:#0879c9;color:#fff}
button,input,textarea{font:inherit}
button{border:0}
#desktop{position:fixed;inset:0;background:linear-gradient(135deg,#0879c9,#1268b5 55%,#07518f);overflow:hidden}
.wallpaper{position:absolute;inset:0;opacity:.24;background:
radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),
radial-gradient(circle at 70% 30%,#fff 0 1px,transparent 2px);
background-size:110px 110px,170px 170px}
#desktopIcons{position:absolute;inset:0;pointer-events:none}
#trashIcon{position:absolute;left:12px;top:12px;width:82px;height:82px;z-index:50}
#trashIcon.drag-over{background:#ffffff33;border-color:#ffffffaa;transform:scale(1.06)}
#trashIcon .ico{font-size:34px}
.trash-dialog{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60000;display:none;align-items:center;justify-content:center}
.trash-dialog.show{display:flex}
.trash-box{width:min(520px,calc(100vw - 30px));max-height:min(620px,calc(100vh - 40px));background:#f5f5f5;color:#222;border-radius:6px;box-shadow:0 15px 50px #0009;overflow:hidden;display:flex;flex-direction:column}
.trash-head{height:54px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 16px;font-size:17px}
.trash-head span{flex:1}
.trash-head button{width:34px;height:34px;background:transparent;color:#444;font-size:22px;cursor:pointer;border-radius:4px}
.trash-head button:hover{background:#eee}
.trash-list{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:7px}
.trash-item{background:#fff;border:1px solid #ddd;border-radius:4px;min-height:58px;display:flex;align-items:center;padding:8px 10px;gap:10px}
.trash-item .trash-item-icon{font-size:26px;width:36px;text-align:center}
.trash-item .trash-item-name{flex:1;font-size:13px}
.trash-item button{padding:7px 11px;background:#1683d8;color:#fff;border:0;border-radius:3px;cursor:pointer}
.trash-item button:hover{background:#0f70b8}
.trash-empty{padding:35px;text-align:center;color:#777}
.icon{position:absolute;width:82px;min-height:82px;pointer-events:auto;color:#fff;text-shadow:0 1px 3px #003;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid transparent;border-radius:3px;cursor:pointer}
.icon:hover{background:#ffffff22;border-color:#ffffff44}
.icon .ico{font-size:34px;line-height:38px}.icon span:last-child{font-size:12px;text-align:center}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(20,20,20,.92);display:flex;align-items:center;z-index:10000}
#startBtn,#quickBtn{height:48px;width:52px;background:transparent;color:#fff;font-size:23px;cursor:pointer}
#startBtn:hover,#quickBtn:hover{background:#333}
#quickBtn{font-size:20px;border-left:1px solid #333}
#taskApps{display:flex;height:100%;align-items:stretch;flex:1}
.task{min-width:52px;padding:0 14px;background:#202020;color:#ddd;border-left:1px solid #333;cursor:pointer}
.task.active{background:#333;color:#fff;border-bottom:2px solid #20a4ff}
#tray{display:flex;align-items:center;gap:14px;padding:0 14px;font-size:12px}
#startMenu{
  position:absolute;
  left:0;
  bottom:48px;
  width:430px;
  height:520px;

  background:rgba(30,30,30,.98);
  box-shadow:0 0 20px #0008;

  z-index:11000;

  display:flex;

  /* アニメーション開始状態 */
  opacity:0;
  visibility:hidden;
  transform:translateY(35px) scale(.98);
  transform-origin:bottom left;

  transition:
    opacity .18s ease,
    transform .25s cubic-bezier(.2,.8,.2,1),
    visibility 0s linear .25s;
}

#startMenu.show{
  opacity:1;
  visibility:visible;

  transform:translateY(0) scale(1);

  pointer-events:auto;

  transition:
    opacity .18s ease,
    transform .25s cubic-bezier(.2,.8,.2,1),
    visibility 0s;
}
.start-left{width:110px;background:#242424;padding-top:10px;display:flex;flex-direction:column;align-items:center}
.start-left button{width:90px;height:58px;background:transparent;color:#ddd;cursor:pointer}.start-left button:hover{background:#3b3b3b}
.start-main{flex:1;padding:18px}.start-main h2{font-weight:400;margin:0 0 14px}
.app-tile{display:flex;align-items:center;gap:12px;padding:11px;border-radius:3px;cursor:pointer}
.app-tile:hover{background:#3b3b3b}.app-tile b{font-size:25px;font-weight:400}
.window{position:absolute;left:180px;top:100px;width:720px;height:480px;background:#f4f4f4;color:#111;border:1px solid #777;box-shadow:0 8px 30px #0008;display:flex;flex-direction:column;min-width:280px;min-height:180px;resize:both;overflow:hidden}
.window.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 48px)!important;resize:none}
.titlebar{height:38px;background:#fff;display:flex;align-items:center;user-select:none;border-bottom:1px solid #ddd;cursor:default}
.titlebar .appmark{width:40px;text-align:center;font-size:20px}.titlebar .title{flex:1;font-size:13px}
.controls{display:flex;height:100%}.controls button{width:46px;background:transparent;color:#333;cursor:pointer}.controls button:hover{background:#e5e5e5}.controls .close:hover{background:#e81123;color:#fff}
.content{flex:1;min-height:0;overflow:auto}
.lock{position:fixed;inset:0;background:linear-gradient(135deg,#0b5ca8,#143c70);z-index:50000;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
.lock.hidden{opacity:0;pointer-events:none}
.lockbox{text-align:center;width:320px}.lockbox .avatar{font-size:72px;margin-bottom:10px}.lockbox h1{font-weight:400;margin:5px}.lockbox p{margin:8px 0 18px;color:#dcecff}.lockbox input{width:240px;padding:11px;border:1px solid #ddd}.lockbox button{margin-top:10px;padding:10px 25px;background:#1683d8;color:#fff;cursor:pointer}.hint{font-size:11px;opacity:.7;margin-top:15px}
.explorer{height:100%;display:flex;background:#fff;overflow:hidden;min-height:0}.side{width:190px;flex:0 0 190px;box-sizing:border-box;border-right:1px solid #ddd;padding:10px;background:#f7f7f7;overflow-y:auto;overflow-x:hidden;min-height:0}.side div{padding:8px;cursor:pointer}.side div:hover,.side .sel{background:#e5f2ff}
.side button{display:block;width:100%;margin:5px 0;padding:7px;text-align:left;background:#fff;border:1px solid #ccc;cursor:pointer}.side button:hover{background:#eaf5ff}.files{flex:1;min-width:0;min-height:0;padding:15px;display:flex;gap:14px;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;overflow-y:auto;overflow-x:hidden}.fileitem{width:86px;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;flex:0 0 86px}.fileitem:hover{background:#eef6ff;border-color:#c8def5}.fileitem .big{font-size:38px}.fileitem span{font-size:12px;text-align:center}
.notepad{height:100%;display:flex;flex-direction:column}.editorbar{height:42px;background:#f2f2f2;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:4px;padding:5px}.editorbar button{padding:6px 12px;background:#fff;border:1px solid #ccc;cursor:pointer}.editorbar button:hover{background:#e5e5e5}.editor{flex:1;display:flex;min-height:0}.lines{width:42px;background:#f3f3f3;color:#888;text-align:right;padding:9px 7px;line-height:20px;font:14px/20px Consolas,monospace;overflow:hidden}.code{flex:1;border:0;outline:0;resize:none;padding:9px;font:14px/20px Consolas,monospace;color:#111;background:#fff;white-space:pre;overflow:auto}
.terminal{height:100%;background:#0c0c0c;color:#eee;font:14px Consolas,monospace;padding:12px;overflow:auto}.terminal input{background:transparent;border:0;outline:0;color:#fff;width:80%;font:inherit}
/* ターミナル内だけ文字選択を許可 */
.terminal,
.terminal *,
.terminal-window,
.terminal-window * {
  user-select: auto;
  -webkit-user-select: auto;
}
.settings{
  padding:24px;
  background:#f5f5f5;
  height:100%;
  overflow:auto;
  color:#222;
}

.settings h2{
  color:#222;
}

.settings section{
  background:#fff;
  border:1px solid #ddd;
  border-radius:4px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}

.settings section h3{
  margin:0 0 14px;
  font-size:16px;
  font-weight:400;
  color:#222;
}

.settings label{
  display:flex;
  align-items:center;
  gap:10px;
  margin:10px 0;
  font-size:13px;
  color:#444;
}

.settings label input[type="text"],
.settings label input[type="password"]{
  flex:1;
  min-width:0;
  padding:8px 10px;
  border:1px solid #bbb;
  background:#fff;
  color:#222;
  outline:none;
}

.settings label input[type="text"]:focus,
.settings label input[type="password"]:focus{
  border-color:#1683d8;
}

.settings button{
  border:1px solid #bbb;
  background:#fff;
  color:#222;
  cursor:pointer;
  border-radius:2px;
}

.settings button:hover{
  background:#eaf5ff;
  border-color:#1683d8;
}

.settings input[type="color"]{
  width:48px;
  height:32px;
  padding:2px;
  border:1px solid #bbb;
  background:#fff;
  cursor:pointer;
}
.settings-quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.settings-quick{
  min-height:75px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;

  background:#fff;
  color:#222;

  border:1px solid #ccc;
  border-radius:4px;

  cursor:pointer;
  transition:.15s;
}

.settings-quick:hover{
  background:#eaf5ff;
  border-color:#1683d8;
}

.settings-quick.active{
  background:#1683d8;
  color:#fff;
  border-color:#1683d8;
}

.settings-quick .quick-icon{
  font-size:27px;
  width:35px;
  text-align:center;
}

.settings-quick span:last-child{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.settings-quick b{
  font-size:13px;
  font-weight:500;
}

.settings-quick small{
  font-size:11px;
  opacity:.75;
}


.settings-slider{
  margin-top:18px;
}

.settings-slider > div{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
  font-size:13px;
  color:#555;
}

.settings-slider input[type="range"]{
  width:100%;
  margin:0;
}
.about{padding:30px}.about h1{font-weight:400}
#toast{position:absolute;right:20px;bottom:65px;background:#222;color:#fff;padding:12px 18px;border-radius:3px;opacity:0;transform:translateY(10px);transition:.2s;z-index:30000}
#toast.show{opacity:1;transform:none}
.webbrowser{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#f7f7f7;
  color:#222;
  position:relative;
  overflow:hidden;
}


/* ================================
   タブ
================================ */

.browser-tabs{
  height:38px;
  display:flex;
  align-items:flex-end;
  gap:4px;
  padding:4px 8px 0;
  background:#202020;
}

.browser-tab{
  height:34px;
  min-width:210px;
  max-width:300px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
  box-sizing:border-box;
  background:#303030;
  color:#ddd;
  border-radius:8px 8px 0 0;
  font-size:13px;
}

.browser-tab.active{
  background:#f5f5f5;
  color:#222;
}

.browser-tab-icon{
  font-size:14px;
}

.browser-tab-title{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.browser-tab-close{
  border:0;
  background:transparent;
  color:inherit;
  font-size:17px;
  cursor:pointer;
  border-radius:4px;
}

.browser-tab-close:hover{
  background:rgba(128,128,128,.2);
}

.browser-new-tab{
  width:32px;
  height:30px;
  margin-bottom:2px;
  border:0;
  background:transparent;
  color:#ddd;
  font-size:20px;
  cursor:pointer;
}

.browser-new-tab:hover{
  background:#333;
}


/* ================================
   ツールバー
================================ */

.browser-toolbar{
  height:52px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 9px;
  box-sizing:border-box;
  background:#f5f5f5;
  border-bottom:1px solid #d5d5d5;
}

.browser-nav{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#333;
  font-size:20px;
  cursor:pointer;
}

.browser-nav:hover{
  background:#e5e5e5;
}

.browser-address-wrap{
  flex:1;
  height:38px;
  display:flex;
  align-items:center;
  background:#fff;
  border:1px solid #c8c8c8;
  border-radius:20px;
  padding:0 8px;
  box-sizing:border-box;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.05);
}

.browser-address-wrap:focus-within{
  border-color:#4285f4;
  box-shadow:0 0 0 2px rgba(66,133,244,.12);
}

.browser-site-icon{
  width:28px;
  text-align:center;
  font-size:14px;
}

.browser-address{
  flex:1;
  height:32px;
  border:0;
  outline:none;
  background:transparent;
  font-size:14px;
  color:#222;
  min-width:0;
}

.browser-star{
  width:30px;
  height:30px;
  border:0;
  background:transparent;
  font-size:19px;
  color:#666;
  cursor:pointer;
}

.browser-star:hover{
  color:#222;
}

.browser-menu{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  font-size:23px;
  cursor:pointer;
  border-radius:50%;
}

.browser-menu:hover{
  background:#e5e5e5;
}


/* ================================
   読み込みバー
================================ */

.browser-loading{
  height:2px;
  overflow:hidden;
  background:transparent;
}

.browser-loading-bar{
  width:0;
  height:100%;
  background:#4285f4;
}

.webbrowser.loading
.browser-loading-bar{
  width:100%;
  animation:
    browserLoading 1.2s
    ease-in-out infinite;
}

@keyframes browserLoading{

  0%{
    transform:translateX(-100%);
  }

  100%{
    transform:translateX(100%);
  }

}


/* ================================
   ページ
================================ */

.browser-page{
  position:relative;
  flex:1;
  min-width:0;
  min-height:0;
  background:white;
  overflow:hidden;
}

.browser-frame{
  display:none;

  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  min-width:0;
  min-height:0;

  border:0;
  margin:0;
  padding:0;

  background:#fff;
}


/* ================================
   ホーム
================================ */

.browser-home{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  background:
    radial-gradient(
      circle at top,
      #eef5ff 0,
      #fff 45%,
      #f7f7f7 100%
    );
}

.browser-logo{
  font-size:64px;
  margin-bottom:8px;
}

.browser-home h1{
  margin:0 0 25px;
  font-size:28px;
  font-weight:400;
  color:#333;
}

.browser-home-search{
  width:min(620px,80%);
  height:50px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 16px;
  box-sizing:border-box;
  background:white;
  border:1px solid #d0d0d0;
  border-radius:26px;
  box-shadow:
    0 3px 14px rgba(0,0,0,.08);
}

.browser-home-search span{
  font-size:18px;
}

.browser-home-search input{
  flex:1;
  height:42px;
  border:0;
  outline:0;
  font-size:15px;
  background:transparent;
}

.browser-shortcuts{
  display:flex;
  gap:20px;
  margin-top:30px;
}

.browser-shortcuts button{
  width:76px;
  height:78px;
  border:0;
  background:transparent;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.browser-shortcuts button:hover{
  background:rgba(0,0,0,.06);
}

.browser-shortcuts button span{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#eee;
  font-size:19px;
}

.browser-shortcuts small{
  color:#555;
}

.browser-home-info{
  margin-top:35px;
  color:#999;
  font-size:12px;
}


/* ================================
   ステータス
================================ */

.browser-status{
  height:23px;
  padding:4px 10px;
  box-sizing:border-box;
  background:#f5f5f5;
  border-top:1px solid #ddd;
  color:#777;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}


/* ================================
   メニュー
================================ */

.browser-popup-menu{
  position:absolute;
  right:10px;
  top:94px;
  width:220px;
  padding:6px;
  display:none;
  flex-direction:column;
  background:white;
  border:1px solid #d0d0d0;
  border-radius:8px;
  box-shadow:
    0 10px 30px rgba(0,0,0,.2);
  z-index:100;
}

.browser-popup-menu.show{
  display:flex;
}

.browser-popup-menu button{
  width:100%;
  height:38px;
  text-align:left;
  padding:0 12px;
  border:0;
  background:transparent;
  border-radius:5px;
  cursor:pointer;
  color:#222;
}

.browser-popup-menu button:hover{
  background:#f0f0f0;
}

.browser-popup-menu hr{
  width:100%;
  border:0;
  border-top:1px solid #eee;
  margin:5px 0;
}

/* ================================
   ブラウザ：履歴・お気に入り・タブ
================================ */
.browser-tabs{
  overflow-x:auto;
  scrollbar-width:thin;
}
.browser-tab{
  flex:0 1 260px;
  min-width:150px;
  max-width:300px;
  position:relative;
  user-select:none;
}
.browser-tab.active{
  box-shadow:inset 0 2px 0 #4285f4;
}
.browser-tab-close{
  flex:none;
  width:25px;
  height:25px;
  padding:0;
  line-height:25px;
}
.browser-new-tab{
  flex:none;
  border-radius:5px;
}
.browser-popup-menu{
  width:250px;
  max-height:420px;
  overflow:auto;
}
.browser-popup-menu button{
  display:flex;
  align-items:center;
  gap:8px;
}
.browser-browser-panel{
  position:absolute;
  top:92px;
  right:10px;
  width:min(430px,calc(100% - 20px));
  max-height:calc(100% - 125px);
  background:#fff;
  color:#222;
  border:1px solid #ccc;
  border-radius:8px;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  z-index:250;
  display:none;
  flex-direction:column;
  overflow:hidden;
}
.browser-browser-panel.show{
  display:flex;
}
.browser-panel-head{
  height:48px;
  flex:none;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid #ddd;
  background:#f7f7f7;
}
.browser-panel-head strong{
  flex:1;
  font-size:15px;
  font-weight:500;
}
.browser-panel-head button{
  width:32px;
  height:32px;
  background:transparent;
  color:#555;
  font-size:20px;
  cursor:pointer;
  border-radius:5px;
}
.browser-panel-head button:hover{background:#e8e8e8}
.browser-panel-body{
  padding:8px;
  overflow:auto;
}
.browser-panel-empty{
  padding:28px 12px;
  text-align:center;
  color:#888;
  font-size:13px;
}
.browser-list-item{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 9px;
  border:0;
  border-radius:6px;
  background:transparent;
  color:#222;
  text-align:left;
  cursor:pointer;
}
.browser-list-item:hover{background:#eef6ff}
.browser-list-icon{
  width:30px;
  flex:none;
  text-align:center;
  font-size:18px;
}
.browser-list-main{
  min-width:0;
  flex:1;
}
.browser-list-title{
  display:block;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.browser-list-url{
  display:block;
  margin-top:2px;
  color:#777;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.browser-list-time{
  display:block;
  margin-top:2px;
  color:#aaa;
  font-size:9px;
}
.browser-list-delete{
  flex:none;
  width:28px;

<script>
/* ==========================================================
   WebOS 10
   - ロック画面
   - ウィンドウマネージャー
   - ファイルシステム(localStorage)
   - テキストエディター
   - 独自JS APIによるウィンドウ生成
   ========================================================== */
let currentFolder = "";
const CONFIG='webos10_config_v1';

const STORE = "webos10_files_v2";

let files = JSON.parse(localStorage.getItem(STORE) || "null") || {
  "README.md": {
    type: "file",
    content: `# WebOS 10

WebOS 10 はブラウザ上で動作するWeb OSです。

## ファイル操作

- New File
- New Folder
- Open File
- Rename
- Delete
- フォルダ移動

## JavaScript

apps.jsにはWebOS専用JavaScript APIのサンプルがあります。
`
  },

  "hello.txt": {
    type: "file",
    content: "Hello, WebOS 10!"
  },

  "apps.js": {
    type: "file",
    content: `// WebOS 10 JavaScript

// 普通のJavaScript
let name = "WebOS";
console.log(name);

// ウィンドウを作る
OS.window(
  "My App",
  "<h1>Hello WebOS!</h1><p>自作アプリです。</p>"
);

// 通知
OS.toast("Hello!");

// アプリを開く
OS.openApp("explorer");
OS.openApp("editor");
OS.openApp("calculator");
OS.openApp("browser");
OS.openApp("taskmgr");
OS.openApp("terminal");
OS.openApp("settings");

// ファイルを作る
OS.writeFile(
  "hello.txt",
  "JavaScriptから書き込みました！"
);

// ファイルを読む
let text = OS.readFile("README.md");
console.log(text);

// ファイル一覧
console.log(OS.listFiles());

//フォルダを作る
    OS.mkdir("Games");

//フォルダの中にファイルを作る
OS.mkdir("Games/MyGame");

//ファイルを編集する
OS.writeFile(
  "Games/MyGame/main.js",
  'console.log("Hello Game");'
);

console.log(
  OS.listFolder("Games/MyGame")
);
`
  },

  "index.html": {
    type: "file",
    content: `
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My WebOS App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
      color: #222;

    button {
      padding: 10px 16px;
      cursor: pointer;

  </style>
</head>
<body>
  <h1>Hello WebOS!</h1>

  </button>
</body>

    `
  },
    
  "Documents": {
    type: "folder"
  },

  "Documents/memo.txt": {
    type: "file",

`

`

localStorage.setItem(STORE, JSON.stringify(files));
let pin = '1234'
let config=Object.assign(
  {
    pin:'1234',
    accent:'#0879c9',
    username:'WebOS User'
  },
  JSON.parse(localStorage.getItem(CONFIG)||'{}')
);
let z=200, winId=0, activeFile='README.md', windowsMap={};

function saveFiles(){localStorage.setItem(STORE,JSON.stringify(files))}
function saveConfig(){localStorage.setItem(CONFIG,JSON.stringify(config))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

function lock(){
  document.getElementById('lock').classList.remove('hidden');
  document.getElementById('pin').value='';
  setTimeout(()=>document.getElementById('pin').focus(),150);
}
function unlock(){

  const input =
    document.getElementById('pin');

  const error =
    document.getElementById('pinError');

  if(input.value === config.pin){

    error.textContent = "";

    document
      .getElementById('lock')
      .classList.add('hidden');

  }else{

    error.textContent =
      "パスワードが違います";

    input.value = "";

    input.focus();
  }
}
const SPECIAL_RECOVERY_PASSWORD = "appleQer!";

function showPasswordRecovery(){

  document.getElementById(
    'recoveryDialog'
  ).style.display = 'flex';

}

function closeRecovery(){

  document.getElementById(
    'recoveryDialog'
  ).style.display = 'none';

}

function showSpecialRecovery(){

  closeRecovery();

  const dialog =
    document.getElementById(
      'specialRecoveryDialog'
    );

  dialog.style.display = 'flex';

  const input =
    document.getElementById(
      'recoveryPassword'
    );

  input.value = '';

  document.getElementById(
    'recoveryError'
  ).textContent = '';

  setTimeout(() => input.focus(), 100);

}

function closeSpecialRecovery(){

  document.getElementById(
    'specialRecoveryDialog'
  ).style.display = 'none';

}

function recoverWithSpecialPassword(){

  const input =
    document.getElementById('recoveryPassword');

  const error =
    document.getElementById('recoveryError');

  if(input.value !== SPECIAL_RECOVERY_PASSWORD){

    error.textContent =
      '回復用パスワードが違います。';

    input.value = '';
    input.focus();

    return;
  }

  // ★ 復元前のPINを保存
  const previousPin = config.pin;

  // PINを初期PINに戻す
  config.pin = '1234';

  saveConfig();

  closeSpecialRecovery();

  // PIN入力欄を空にする
  document.getElementById('pin').value = '';

  // ★ 復元前・復元後のPINを両方表示
  alert(
    'パスワードを回復しました。\n\n' +
    '復元前のPIN: ' + previousPin + '\n' +
    '復元後のPIN: 1234'
  );

  pin = "1234";

  // PIN入力欄にフォーカス
  document.getElementById('pin').focus();
}
function resetEverything(){

  const ok = confirm(
    '本当にすべて初期化しますか？\n\n' +
    'ファイル、PIN、設定、デスクトップアイコンの位置が初期状態に戻ります。'
  );

  if(!ok){
    return;
  }

  // ファイル
  localStorage.removeItem(STORE);

  // 設定
  localStorage.removeItem(CONFIG);

  // デスクトップアイコン位置
  localStorage.removeItem(
    'webos10_desktop_positions_v1'
  );

  localStorage.removeItem(
    'webos10_desktop_items_v1'
  );

  // 初期状態へ
  location.reload();

}
function updateUsername(){
  const el = document.getElementById('lockUsername');

  if(el){
    el.textContent = config.username || 'WebOS User';
  }
}
function shutdown(){

  document
    .querySelectorAll('.window')
    .forEach(w => w.remove());

  const desktop =
    document.getElementById('desktop');

  if(desktop){
    desktop.style.display = 'none';
  }

  const screen =
    document.createElement('div');

  screen.id = 'powerOffScreen';

  screen.innerHTML = `
    <div class="power-off-content">

      <div class="power-logo">⊞</div>

      <div class="power-text">
        シャットダウンしています
      </div>

      <div class="power-spinner">
        <i></i><i></i><i></i><i></i>
        <i></i><i></i><i></i><i></i>
      </div>

    </div>
  `;

  document.body.appendChild(screen);

  setTimeout(() => {

    screen.innerHTML = `
      <div class="power-off-content">

        <div class="power-logo"></div>

        <div class="power-text">
          電源が切れています
        </div>

        <div class="power-hint">
          画面をクリックするかキーを押して起動
        </div>

      </div>
    `;

    setupPowerOnEvents();

  }, 2200);
}
let powerOnEventsInstalled = false;


function setupPowerOnEvents(){

  if(powerOnEventsInstalled)
    return;

  powerOnEventsInstalled = true;

  document.addEventListener(
    'keydown',
    powerOnFromInput
  );

  document.addEventListener(
    'mousedown',
    powerOnFromInput
  );

  document.addEventListener(
    'touchstart',
    powerOnFromInput,
    {passive:true}
  );
}


function powerOnFromInput(){

  const screen =
    document.getElementById(
      'powerOffScreen'
    );

  if(!screen)
    return;

  // イベントを解除
  document.removeEventListener(
    'keydown',
    powerOnFromInput
  );

  document.removeEventListener(
    'mousedown',
    powerOnFromInput
  );

  document.removeEventListener(
    'touchstart',
    powerOnFromInput
  );

  powerOnEventsInstalled =
    false;

  bootWebOS();
}
function bootWebOS(){

  const screen =
    document.getElementById(
      'powerOffScreen'
    );

  if(!screen)
    return;

  screen.classList.remove(
    'powered-off'
  );

  screen.innerHTML = `
    <div class="power-off-content">

      <div class="power-logo">
        ⊞
      </div>

      <div class="power-text">
        WebOS を起動しています
      </div>

      <div class="power-spinner">
        <i></i><i></i><i></i><i></i>
        <i></i><i></i><i></i><i></i>
      </div>

    </div>
  `;

  setTimeout(() => {

    screen.innerHTML = `
      <div class="power-off-content">

        <div class="power-logo">
          ⊞
        </div>

        <div class="power-text">
          WebOS
        </div>

        <div class="boot-status">
          システムを準備しています...
        </div>

      </div>
    `;

  }, 900);


  setTimeout(() => {

    screen.style.opacity = '0';

    setTimeout(() => {

      screen.remove();

      const desktop =
        document.getElementById(
          'desktop'
        );

      if(desktop){
        desktop.style.display = '';
      }

      // 起動後はロック画面
      lock();

    }, 500);

  }, 2200);
}
function restart(){

  document
    .querySelectorAll('.window')
    .forEach(w => w.remove());

  const desktop =
    document.getElementById('desktop');

  if(desktop){
    desktop.style.display = 'none';
  }

  const screen =
    document.createElement('div');

  screen.id =
    'restartScreen';

function positionTaskPreview(group){

  const preview =
    group.querySelector('.task-preview');

  if(!preview) return;

  const button =
    group.querySelector('.task');

  if(!button) return;

  // 表示状態にしてサイズを取得
  const oldVisibility = preview.style.visibility;
  const oldOpacity = preview.style.opacity;

  preview.style.visibility = 'hidden';
  preview.style.opacity = '1';
  preview.style.pointerEvents = 'none';

  const rect =
    button.getBoundingClientRect();

  const previewRect =
    preview.getBoundingClientRect();

  const margin = 8;

  // 基本位置：アイコンの中央
  let left =
    rect.left +
    rect.width / 2 -
    previewRect.width / 2;

  // 左にはみ出さない
  if(left < margin){
    left = margin;
  }

  // 右にはみ出さない
  if(left + previewRect.width >
     window.innerWidth - margin){

    left =
      window.innerWidth -
      previewRect.width -
      margin;
  }

  // 下からの位置
  const bottom =
    window.innerHeight -
    rect.top +
    5;

  preview.style.left =
    Math.round(left) + 'px';

  preview.style.bottom =
    Math.round(bottom) + 'px';

  preview.style.right =
    'auto';

  preview.style.visibility =
    oldVisibility;

  preview.style.opacity =
    oldOpacity;

  preview.style.pointerEvents =
    '';
}

function makeDraggable(w,bar){
  let drag=false,dx=0,dy=0;
  bar.addEventListener('mousedown',e=>{
    if(e.target.closest('button')||w.classList.contains('max'))return;
    drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;focusWindow(w.id)
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    const maxX=innerWidth-w.offsetWidth,maxY=innerHeight-48-w.offsetHeight;
    w.style.left=Math.max(0,Math.min(maxX,e.clientX-dx))+'px';
    w.style.top=Math.max(0,Math.min(maxY,e.clientY-dy))+'px';
  });
  document.addEventListener('mouseup',()=>drag=false);
  bar.addEventListener('dblclick',e=>{if(!e.target.closest('button'))maximizeWindow(w.id)})
}

/* =========================
   パス関連
========================= */

function normalizePath(path){
  return String(path || "")
    .replace(/\\/g, "/")
    .replace(/^\/+|\/+$/g, "");
}

function joinPath(folder, name){
  folder = normalizePath(folder);
  name = normalizePath(name);

  return folder ? folder + "/" + name : name;
}

/* =========================
   現在のフォルダにある項目だけ取得
========================= */

function getCurrentFolderItems(){
  const result = [];

  Object.keys(files).forEach(path => {
    path = normalizePath(path);

    if(!path) return;

    const parts = path.split("/");
    const parent = parts.slice(0, -1).join("/");
    const name = parts[parts.length - 1];

    // 現在のフォルダ直下だけ表示
    if(parent === currentFolder){
      result.push({
        path,
        name,
        data: files[path]
      });
    }
  });

  return result.sort((a,b) => {

    // フォルダを先に表示
    if(a.data.type === "folder" && b.data.type !== "folder") return -1;
    if(a.data.type !== "folder" && b.data.type === "folder") return 1;

    return a.name.localeCompare(b.name, "ja");
  });
}

      '📁 ' + part;

    folderBtn.title =
      folderPath;

    folderBtn.style.cssText = `
      border:0;
      background:transparent;
      padding:4px 7px;
      cursor:pointer;
      font-size:12px;
      color:#333;
      border-radius:4px;
      flex-shrink:0;
    `;

    folderBtn.onmouseenter = () => {
      folderBtn.style.background =
        'rgba(0,0,0,.08)';
    };

    folderBtn.onmouseleave = () => {
      folderBtn.style.background =
        'transparent';
    };

    folderBtn.onclick = () => {

      currentFolder =
        folderPath;

      selectedExplorerFile = null;

      renderFiles(winId);

      if(typeof renderExplorerFolderTree === 'function'){
        renderExplorerFolderTree();
      }
    };

    pathBar.appendChild(folderBtn);
  });

  grid.appendChild(pathBar);

  /* =========================
     現在のフォルダの項目
  ========================= */

  const prefix =
    folder
      ? folder + '/'
      : '';

  const entries = [];

  Object.keys(files).forEach(path => {

    const normalized =
      normalizePath(path);

    if(!normalized.startsWith(prefix)){
      return;
    }

    const relative =
      normalized.slice(prefix.length);

    if(!relative){
      return;
    }

    /*
     * 現在のフォルダ直下だけ表示
     */
    if(relative.includes('/')){
      return;
    }

    entries.push({
      path: normalized,
      data: files[path]
    });
  });

  /* =========================
     フォルダ → ファイル
  ========================= */

  entries.sort((a,b) => {

    const af =
      a.data?.type === 'folder';

    const bf =
      b.data?.type === 'folder';

    if(af && !bf) return -1;
    if(!af && bf) return 1;

    return a.path.localeCompare(
      b.path,
      'ja'
    );
  });

  /* =========================
     アイテム生成
  ========================= */

  entries.forEach(entry => {

    const path = entry.path;
    const data = entry.data || {};

    const name =
      path.split('/').pop();

    const isFolder =
      data.type === 'folder';

    const d =
      document.createElement('div');

    d.className =
      'explorer-file-item';

    d.dataset.path =
      path;

    d.style.cssText = `
  width:100%;
  height:100px;
  min-width:0;
  min-height:100px;

  padding:8px;
  margin:0;

  box-sizing:border-box;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;

  border:1px solid transparent;
  border-radius:6px;

  cursor:pointer;

  user-select:none;
  -webkit-user-select:none;
`;

    /* =========================
       アイコン
    ========================= */

    const iconEl =
      document.createElement('div');

    iconEl.style.cssText = `
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:32px;
      margin-bottom:5px;
    `;

    iconEl.textContent =
      isFolder
        ? '📁'
        : (
          typeof desktopItemIcon === 'function'
            ? desktopItemIcon(path)
            : '📄'
        );

    d.appendChild(iconEl);

    /* =========================
       名前
    ========================= */

    const nameEl =
      document.createElement('div');

    nameEl.textContent =
      name;

    nameEl.title =
      path;

    nameEl.style.cssText = `
      width:100%;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;

      text-align:center;

      font-size:12px;
      color:#222;
    `;

    d.appendChild(nameEl);

    /* =========================
       クリック
    ========================= */

    d.onclick = e => {

      e.stopPropagation();

      grid
        .querySelectorAll(
          '.explorer-file-item'
        )
        .forEach(el => {

          el.style.background =
            'transparent';

          el.style.borderColor =
            'transparent';
        });

      d.style.background =
        'rgba(0,120,215,.12)';

      d.style.borderColor =
        'rgba(0,120,215,.35)';

      selectedExplorerFile =
        path;

      const selected =
        win.querySelector(
          '#explorerSelected'
        );

      if(selected){
        selected.textContent =
          path;
      }
    };

    /* =========================
       ダブルクリック
    ========================= */

    d.ondblclick = e => {

      e.stopPropagation();

      if(isFolder){

        currentFolder =
          path;

        selectedExplorerFile = null;

        renderFiles(winId);

        if(typeof renderExplorerFolderTree === 'function'){
          renderExplorerFolderTree();
        }

        return;
      }

      if(typeof openFileByPath === 'function'){

        openFileByPath(path);

      }else if(typeof openFile === 'function'){

        openFile(path);

      }else{

        console.warn(
          'ファイルを開く関数が見つかりません:',
          path
        );
      }
    };

    /* =========================
       ドラッグ開始
    ========================= */

    d.draggable = true;

    d.addEventListener('dragstart', e => {

      e.dataTransfer.setData(
        'text/webos-path',
        path
      );

      e.dataTransfer.setData(
        'text/webos-type',
        isFolder
          ? 'folder'
          : 'file'
      );

      e.dataTransfer.effectAllowed =
        'copyMove';

      d.classList.add('dragging');

      selectExplorerFile(path);
    });

    d.addEventListener('dragend', () => {

      d.classList.remove('dragging');

      document
        .querySelectorAll(
          '.explorer-drop-target'
        )
        .forEach(el => {

          el.classList.remove(
            'explorer-drop-target'
          );
        });
    });

    /* =========================
       フォルダへのドロップ
    ========================= */

    if(isFolder){

      d.addEventListener('dragover', e => {

        const sourcePath =
          normalizePath(
            e.dataTransfer.getData(
              'text/webos-path'
            )
          );

        if(!sourcePath) return;

        /*
         * 自分自身は禁止
         */
        if(sourcePath === path){
          return;
        }

        /*
         * 自分の中へ移動するのは禁止
         */
        if(
          path.startsWith(
            sourcePath + '/'
          )
        ){
          return;
        }

        e.preventDefault();

        e.dataTransfer.dropEffect =
          'move';

        d.classList.add(
          'explorer-drop-target'
        );
      });

      d.addEventListener('dragleave', e => {

        if(!d.contains(e.relatedTarget)){

          d.classList.remove(
            'explorer-drop-target'
          );
        }
      });

      d.addEventListener('drop', e => {

        e.preventDefault();
        e.stopPropagation();

        d.classList.remove(
          'explorer-drop-target'
        );

        const sourcePath =
          normalizePath(
            e.dataTransfer.getData(
              'text/webos-path'
            )
          );

        if(!sourcePath) return;

        if(sourcePath === path){

          toast(
            '自分自身には移動できません'
          );

          return;
        }

        if(
          path.startsWith(
            sourcePath + '/'
          )
        ){

          toast(
            'このフォルダの中には移動できません'
          );

          return;
        }

        const source =
          files[sourcePath];

        if(!source){

          toast(
            '移動元が見つかりません'
          );

          return;
        }

        const name =
          sourcePath
            .split('/')
            .pop();

        const destinationPath =
          path + '/' + name;

        if(files[destinationPath]){

          toast(
            '移動先に同じ名前の項目があります'
          );

          return;
        }

        moveExplorerItem(
          sourcePath,
          destinationPath
        );
      });
    }

    /* =========================
       ホバー
    ========================= */

    d.onmouseenter = () => {

      if(selectedExplorerFile !== path){

        d.style.background =
          'rgba(0,0,0,.05)';
      }
    };

    d.onmouseleave = () => {

      if(selectedExplorerFile !== path){

        d.style.background =
          'transparent';
      }
    };

    grid.appendChild(d);
  });

  /* =========================
     空フォルダ
  ========================= */

  if(entries.length === 0){

    const empty =
      document.createElement('div');

    empty.style.cssText = `
      position:absolute;

      left:220px;
      right:20px;
      top:70px;

      text-align:center;

      color:#888;
      font-size:13px;

      padding:30px;
    `;

    empty.textContent =
      'このフォルダーは空です';

    grid.appendChild(empty);
  }
}
function moveExplorerItem(
  sourcePath,
  destinationPath
){

  sourcePath =
    normalizePath(sourcePath);

  destinationPath =
    normalizePath(destinationPath);

  if(!files[sourcePath]){

    toast(
      '移動元が見つかりません'
    );

    return false;
  }

  if(files[destinationPath]){

    toast(
      '移動先に同じ名前の項目があります'
    );

    return false;
  }

  const sourceItem =
    files[sourcePath];

  /*
   * =========================
   * ファイルの場合
   * =========================
   */

  if(sourceItem.type !== 'folder'){

    files[destinationPath] = {
      ...sourceItem
    };

    delete files[sourcePath];

  }

  /*
   * =========================
   * フォルダの場合
   * =========================
   */

  else{

    const prefix =
      sourcePath + '/';

    const children =
      Object.keys(files)
        .filter(path =>
          path === sourcePath ||
          path.startsWith(prefix)
        );

    /*
     * 先に全データを取得
     */
    const moved = [];

    children.forEach(oldPath => {

      const relative =
        oldPath === sourcePath
          ? ''
          : oldPath.slice(
              prefix.length
            );

      const newPath =
        relative
          ? destinationPath + '/' + relative
          : destinationPath;

      moved.push({
        oldPath,
        newPath,
        data: files[oldPath]
      });
    });

    /*
     * 元を削除
     */
    children.forEach(path => {
      delete files[path];
    });

    /*
     * 新しい場所へ作成
     */
    moved.forEach(entry => {

      files[entry.newPath] =
        entry.data;
    });
  }


  /*
   * =========================
   * ホーム画面のショートカット
   * =========================
   */

  if(
    typeof desktopItems !==
    'undefined'
  ){

    updateDesktopItemPath(
      sourcePath,
      destinationPath
    );
  }


  /*
   * =========================
   * 保存
   * =========================
   */

  if(
    typeof saveFiles ===
    'function'
  ){

    saveFiles();

  }else{

    localStorage.setItem(
      'webos10_files_v2',
      JSON.stringify(files)
    );
  }


  /*
   * Explorer更新
   */

  selectedExplorerFile =
    null;

  renderFiles(
    getExplorerWindow()?.id
  );

  if(
    typeof renderExplorerFolderTree ===
    'function'
  ){

    renderExplorerFolderTree();
  }


  toast(
    sourcePath.split('/').pop() +
    ' を ' +
    destinationPath.substring(
      destinationPath.lastIndexOf('/') + 1
    ) +
    ' に移動しました'
  );

  return true;
}

  if(ext === "js") return "📜";
  if(ext === "html") return "🌐";
  if(ext === "css") return "🎨";
  if(ext === "md") return "📘";
  if(ext === "txt") return "📄";

}

/* =========================
   名前変更
========================= */

function renameSelectedFile(){

  const old =
    selectedExplorerFile || activeFile;

  if(!old || files[old] === undefined){

    toast(
      "ファイルまたはフォルダを選択してください"
    );

    return;
  }

  const oldName =
    old.split("/").pop();

  const newName =
    prompt(
      "新しい名前",
      oldName
    );

  if(!newName || newName === oldName)
    return;

  const parent =
    old.split("/").slice(0,-1).join("/");

  const newPath =
    joinPath(parent, newName);

  if(files[newPath] !== undefined){

    toast(
      "その名前は既に使われています"
    );

    return;
  }

  /*
    フォルダの場合は中身も全部変更
  */

  if(files[old].type === "folder"){

    const prefix = old + "/";

    const children =
      Object.keys(files)
        .filter(path =>
          path.startsWith(prefix)
        );

    files[newPath] = files[old];

    children.forEach(path => {

      const relative =
        path.substring(prefix.length);

      const newChild =
        newPath + "/" + relative;

      files[newChild] =
        files[path];

      delete files[path];

    });

    delete files[old];

  }else{

    files[newPath] =
      files[old];

    delete files[old];

  }

  if(activeFile === old){

    activeFile =
      newPath;

  }

  if(selectedExplorerFile === old){

    selectedExplorerFile =
      newPath;

  }

  /*
    現在フォルダそのものを
    リネームした場合
  */

  if(currentFolder === old){

    currentFolder =
      newPath;

  }

  saveFiles();
  updateDesktopItemPath(old, newPath);

  const ex =
    getExplorerWindow();

  if(ex){

    renderFiles(ex.id);

  }

  toast(
    "名前を変更しました"
  );
}


/* =========================
   削除
========================= */

function deleteSelectedFile(){

  const path =
    selectedExplorerFile || activeFile;

  if(!path || files[path] === undefined){

    toast(
      "削除するファイルまたはフォルダを選択してください"
    );

    return;
  }

  const item =
    files[path];

  const name =
    path.split("/").pop();

  if(!confirm(
    `「${name}」を削除しますか？`
  )){

    return;
  }

  /*
    フォルダなら中身も削除
  */

  if(item.type === "folder"){

    const prefix =
      path + "/";

    Object.keys(files)
      .filter(x =>
        x.startsWith(prefix)
      )
      .forEach(x => {

        delete files[x];

      });
  }

  delete files[path];

  if(activeFile === path){

    activeFile = null;

  }

  selectedExplorerFile = null;

  saveFiles();
  clearDesktopItemsForPath(path);

  const ex =
    getExplorerWindow();

  if(ex){

    renderFiles(ex.id);

  }

  document
    .querySelectorAll("#explorerSelected")
    .forEach(x =>
      x.textContent = "選択なし"
    );

  toast(
    name + " を削除しました"
  );
}

    );

  }
}


/* =========================
   テキストエディター
========================= */

function openEditor(name){

  activeFile = name;

  const text =
    files[name]?.type === "file"
      ? files[name].content
      : "";

  const html = `
<div class="notepad">

  <div class="editorbar">

    <button onclick="editorSave('${encodeURIComponent(name)}')">
      保存
    </button>

    ${
      name.toLowerCase().endsWith(".html")
        ? `<button onclick="editorRunHTML('${encodeURIComponent(name)}')">
      ▶ ブラウザで実行
    </button>`
        : ""
    }

    ${
      name.toLowerCase().endsWith(".js")
        ? `<button onclick="editorRunJS('${encodeURIComponent(name)}')">
      ▶ JSを実行
    </button>`
        : ""
    }

    <button onclick="editorNew()">
      新規
    </button>

    <span
      style="margin-left:auto;font-size:12px;color:#666"
      id="editorName">
      ${escapeHtml(name)}
    </span>

  </div>

  <div class="editor">

    <div class="lines" id="lines"></div>

    <textarea
      class="code"
      id="code"
      spellcheck="false"
    >${escapeHtml(text)}</textarea>

  </div>

</div>
`;

  const id =
    makeWindow(
      "テキスト エディター - " + name,
      html,
      "📝",
      {
        width:820,
        height:560
      }
    );

  const ta =
    document.querySelector(
      `#${id} .code`
    );

  const lines =
    document.querySelector(
      `#${id} .lines`
    );

  function sync(){

    lines.textContent =
      Array.from(
        {
          length:
            Math.max(
              1,
              ta.value.split("\n").length
            )
        },
        (_,i) => i + 1
      ).join("\n");

  }

  ta.addEventListener(
    "input",
    sync
  );

  ta.addEventListener(
    "scroll",
    () => {
      lines.scrollTop =
        ta.scrollTop;
    }
  );

  sync();

  return id;
}


/* =========================
   保存
========================= */

function editorSave(enc){

  const name =
    decodeURIComponent(enc);

  const w =
    [...document.querySelectorAll(".window")]
      .find(x =>
        x.querySelector("#code")
      );

  if(!w) return;

  if(!files[name]){

    toast(
      "ファイルが存在しません"
    );

    return;
  }

  files[name] = {

    type: "file",

    content:
      w.querySelector("#code").value

  };

  saveFiles();

  toast("保存しました");
}


/* =========================
   HTMLをブラウザで実行
========================= */

function editorRunHTML(enc){

  const name =
    decodeURIComponent(enc);

  if(!name.toLowerCase().endsWith(".html")){
    toast("HTMLファイルではありません");
    return;
  }

  const w =
    [...document.querySelectorAll(".window")]
      .find(x =>
        x.querySelector("#code") &&
        x.querySelector("#editorName")?.textContent.trim() === name
      );

  if(!w){
    toast("エディターが見つかりません");
    return;
  }

  const code =
    w.querySelector("#code").value;

  if(!files[name]){
    toast("ファイルが存在しません");
    return;
  }

  // 実行前に現在の内容を保存
  files[name] = {
    type: "file",
    content: code
  };
  saveFiles();

  // ブラウザを起動し、WebOS内のHTMLファイルとして開く
  const browserId = openBrowser();
  const browserWindow =
    document.getElementById(browserId);
  const browser =
    browserWindow?.querySelector(".webbrowser");

  if(!browser){
    toast("ブラウザを起動できませんでした");
    return;
  }

  const localUrl =
    "webos://file/" +
    encodeURIComponent(name);

  const address =
    browser.querySelector(".browser-address");

  if(address){
    address.value = localUrl;
  }

  browserGo(address || browser, localUrl);
}

function openTerminal(){

  const html = `
  <div class="terminal" id="term">

    <div class="term-header">
      <span>WebOS Terminal</span>
      <span>10.0.26100</span>
    </div>

    <div id="termout" class="term-output"></div>

    <div class="term-input-line">
      <span id="termPrompt">C:\\WebOS&gt;</span>
      <input
        id="termInput"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

  </div>
  `;

  const id = makeWindow(
    'ターミナル',
    html,
    '⌨️',
    {
      width: 720,
      height: 450
    }
  );

  const w =
    document.querySelector(`#${id}`);

  const input =
    w.querySelector('#termInput');

  const out =
    w.querySelector('#termout');

  const prompt =
    w.querySelector('#termPrompt');

  let currentPath = 'C:\\WebOS';

  let history = [];
  let historyIndex = -1;

  function write(text = '', cls = ''){
    const div = document.createElement('div');

    if(cls){
      div.className = cls;
    }

    div.innerHTML = escapeHtml(text);

    out.appendChild(div);

    out.scrollTop = out.scrollHeight;
  }

  function writeHTML(html){
    out.insertAdjacentHTML(
      'beforeend',
      html
    );

    out.scrollTop =
      out.scrollHeight;
  }

  function updatePrompt(){
    prompt.textContent =
      currentPath + '>';
  }

  function runCommand(command){

    command = command.trim();

    if(!command){
      write('');
      return;
    }

    history.push(command);

    historyIndex =
      history.length;

    write(
      currentPath + '>' + command,
      'command'
    );

    input.value = '';

    // 実行中表示
    const loading =
      document.createElement('div');

    loading.className =
      'terminal-running';

    loading.textContent =
      '処理中...';

    out.appendChild(loading);

    out.scrollTop =
      out.scrollHeight;

    // 本物っぽく少し待ってから実行
    setTimeout(() => {

      loading.remove();

      termCommand(
        command,
        out,
        {
          getPath: () => currentPath,

          setPath: path => {
            currentPath = path;
            updatePrompt();
          },

          write,

          writeHTML
        }
      );

      out.scrollTop =
        out.scrollHeight;

    }, 180);
  }

  input.addEventListener(
    'keydown',
    e => {

      // Enter
      if(e.key === 'Enter'){

        runCommand(
          input.value
        );

        return;
      }

      // ↑
      if(e.key === 'ArrowUp'){

        e.preventDefault();

        if(!history.length)
          return;

        historyIndex =
          Math.max(
            0,
            historyIndex - 1
          );

        input.value =
          history[historyIndex] || '';

        return;
      }

      // ↓
      if(e.key === 'ArrowDown'){

        e.preventDefault();

        if(!history.length)
          return;

        historyIndex =
          Math.min(
            history.length,
            historyIndex + 1
          );

        input.value =
          history[historyIndex] || '';

        return;
      }

    }
  );

  // ターミナルをクリックしたら入力欄へ
  w.querySelector('.terminal')
    .addEventListener(
      'click',
      () => input.focus()
    );

  // 起動メッセージ
  write(
    'Microsoft Windows [Version 10.0.26100]'
  );

  write(
    '(c) WebOS Corporation. All rights reserved.'
  );

  write('');

  write(
    'WebOS Terminal を起動しています...'
  );

  setTimeout(() => {

    write(
      'システムチェック中...'
    );

  }, 250);

  setTimeout(() => {

    write(
      'ファイルシステムを確認しました。'
    );

  }, 500);

  setTimeout(() => {

    write(
      'ターミナルの準備が完了しました。'
    );
      
    write(
      'helpコマンドですべてのコマンドを確認できます。'
    );

    write('');

    updatePrompt();
    input.focus();

  }, 750);

  return id;
}

/* =========================
   tree : フォルダ構造
========================= */
if(cmd === 'tree'){

  const currentPath = getPath()
    .replace(/^C:\\WebOS\\?/, '')
    .replace(/\\/g, '/')
    .replace(/^\/+|\/+$/g, '');

  const prefix =
    currentPath ? currentPath + '/' : '';

  write('.');
  
  const paths = Object.keys(files)
    .filter(path => {
      const normalized = normalizePath(path);

      return !prefix ||
             normalized.startsWith(prefix);
    })
    .sort((a, b) => a.localeCompare(b, 'ja'));

  if(!paths.length){
    write('└── (空)');
    return;
  }

  paths.forEach((path, index) => {

    const normalized = normalizePath(path);

    let relative = normalized;

    if(prefix && normalized.startsWith(prefix)){
      relative = normalized.slice(prefix.length);
    }

    if(!relative) return;

    const depth =
      relative.split('/').length - 1;

    const name =
      relative.split('/').pop();

    const indent =
      '│   '.repeat(depth);

    const isLast =
      index === paths.length - 1;

    const branch =
      isLast ? '└── ' : '├── ';

    const icon =
      files[path]?.type === 'folder'
        ? '📁 '
        : '📄 ';

    write(indent + branch + icon + name);
  });

  return;

  if(files[source].type === 'folder'){
    write('フォルダのコピーには現在対応していません。');
    return;
  }

  if(files[destination]){
    write('コピー先に同じ名前のファイルがあります。');
    return;
  }

  files[destination] = {
    ...files[source],
    content: files[source].content || ''
  };

  if(typeof saveFiles === 'function'){
    saveFiles();
  }else{
    localStorage.setItem(
      'webos10_files_v2',
      JSON.stringify(files)
    );
  }

  write(`${source} を ${destination} にコピーしました。`);

/* =========================

========================= */

    write('使い方: move <元> <移動先>');
    write('例: move hello.txt test/hello.txt');
    return;
  }

  const source = normalizePath(args[0]);
  const destination = normalizePath(args[1]);

  if(!files[source]){
    write('移動元が見つかりません。');
    return;
  }

  if(files[destination]){
    write('移動先に同じ名前の項目があります。');
    return;
  }

  const sourceItem = files[source];

  // 元をコピー
  files[destination] = sourceItem;

  // 元を削除
  delete files[source];

  // フォルダなら中身のパスも移動
  if(sourceItem.type === 'folder'){

    const children = Object.keys(files)
      .filter(path =>
        path.startsWith(source + '/')
      );

    children.forEach(oldPath => {

      const newPath =
        destination +
        oldPath.slice(source.length);

      files[newPath] = files[oldPath];
      delete files[oldPath];

    });
  }

  // ホーム画面のショートカットのパスも更新
  if(typeof desktopItems !== 'undefined'){

    desktopItems.forEach(item => {

      if(item.path === source){

        item.path = destination;
        item.name =
          destination.split('/').pop();

      }else if(
        sourceItem.type === 'folder' &&
        item.path.startsWith(source + '/')
      ){

        item.path =
          destination +
          item.path.slice(source.length);

      }

    });

    if(typeof saveDesktopItems === 'function'){
      saveDesktopItems();
    }
  }

  if(typeof saveFiles === 'function'){
    saveFiles();
  }else{
    localStorage.setItem(
      'webos10_files_v2',
      JSON.stringify(files)
    );
  }

  if(typeof renderDesktopItems === 'function'){
    renderDesktopItems();
  }

  if(typeof renderExplorerFolderTree === 'function'){
    renderExplorerFolderTree();
  }

  write(`${source} を ${destination} に移動しました。`);

  return;
}


/* =========================
   rename : 名前変更
   rename 元 新しい名前
========================= */
if(cmd === 'rename'){

  if(args.length < 2){
    write('使い方: rename <元> <新しい名前>');
    write('例: rename hello.txt hello2.txt');
    return;
  }

  const source = normalizePath(args[0]);
  const newName = args[1];

  if(!files[source]){
    write('ファイルまたはフォルダが見つかりません。');
    return;
  }

  if(!newName ||
     newName.includes('/') ||
     newName.includes('\\')){

    write('新しい名前が正しくありません。');
    return;
  }

  const parent =
    source.includes('/')
      ? source.substring(
          0,
          source.lastIndexOf('/')
        )
      : '';

  const destination =
    parent
      ? parent + '/' + newName
      : newName;

  if(files[destination]){
    write('同じ名前の項目がすでに存在します。');
    return;
  }

  const sourceItem = files[source];

  files[destination] = sourceItem;
  delete files[source];

  // フォルダの場合、中身も名前変更
  if(sourceItem.type === 'folder'){

    const children = Object.keys(files)
      .filter(path =>
        path.startsWith(source + '/')
      );

    children.forEach(oldPath => {

      const newPath =
        destination +
        oldPath.slice(source.length);

      files[newPath] = files[oldPath];
      delete files[oldPath];

    });
  }

  // ホーム画面ショートカットも更新
  if(typeof desktopItems !== 'undefined'){

    desktopItems.forEach(item => {

      if(item.path === source){

        item.path = destination;
        item.name = newName;

      }else if(
        sourceItem.type === 'folder' &&
        item.path.startsWith(source + '/')
      ){

        item.path =
          destination +
          item.path.slice(source.length);

      }

    });

    if(typeof saveDesktopItems === 'function'){
      saveDesktopItems();
    }
  }

  if(typeof saveFiles === 'function'){
    saveFiles();
  }else{
    localStorage.setItem(
      'webos10_files_v2',
      JSON.stringify(files)
    );
  }

  if(typeof renderDesktopItems === 'function'){
    renderDesktopItems();
  }

  if(typeof renderExplorerFolderTree === 'function'){
    renderExplorerFolderTree();
  }

  write(`${source} の名前を ${destination} に変更しました。`);

  return;
}


/* =========================
   restoration
   設定復元コードを生成・コピー
========================= */
if(cmd === 'restoration'){

  const backup = {
    config: JSON.parse(
      localStorage.getItem('webos10_config_v1') || 'null'
    ),

    desktopPositions: JSON.parse(
      localStorage.getItem(
        'webos10_desktop_positions_v1'
      ) || '{}'
    ),

    desktopItems: JSON.parse(
      localStorage.getItem(
        'webos10_desktop_items_v1'
      ) || '[]'
    ),

    desktopTrash: JSON.parse(
      localStorage.getItem(
        'webos10_desktop_trash_v1'
      ) || '[]'
    )
  };

  /*
   * 復元コードを生成
   */
  const restorationCode =
`// WebOS Restoration Code
const webosRestorationData = ${JSON.stringify(
  backup,
  null,
  2
)};

localStorage.setItem(
  'webos10_config_v1',
  JSON.stringify(webosRestorationData.config)
);

localStorage.setItem(
  'webos10_desktop_positions_v1',
  JSON.stringify(webosRestorationData.desktopPositions)
);

localStorage.setItem(
  'webos10_desktop_items_v1',
  JSON.stringify(webosRestorationData.desktopItems)
);

localStorage.setItem(
  'webos10_desktop_trash_v1',
  JSON.stringify(webosRestorationData.desktopTrash)
);

location.reload();`;

  /*
   * ターミナルに表示
   */
  write('');
  write('========================================');
  write('       WebOS 復元コード');
  write('========================================');
  write('');
  write(restorationCode);
  write('');
  write('========================================');

  /*
   * 自動コピー
   */
  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(restorationCode)
      .then(() => {

        write('');
        write('✓ 復元コードをクリップボードにコピーしました。');

      })
      .catch(() => {

        write('');
        write('⚠ 自動コピーに失敗しました。');
        write('表示されたコードを手動でコピーしてください。');

      });

  }else{

    write('');
    write('⚠ この環境では自動コピーできません。');
    write('表示されたコードを手動でコピーしてください。');

  }

  return;
}

  /* =========================
     lock
  ========================= */

  if(cmd === 'lock'){

    write(
      'WebOSをロックしています...'
    );

    setTimeout(
      () => lock(),
      300
    );

    return;
  }

  /* =========================
   restart
========================= */

if(cmd === 'restart'){

  write(
    'WebOSを再起動しています...'
  );

  setTimeout(() => {

    restart();

  }, 500);

  return;
}
  /* =========================
     shutdown
  ========================= */

  if(cmd === 'shutdown'){

    write(
      'システムをシャットダウンしています...'
    );

    setTimeout(
      () => shutdown(),
      500
    );

    return;
  }


  /* =========================
     unknown
  ========================= */

  write(
    `'${cmd}' は、内部コマンドまたは外部コマンドとして認識されていません。`
  );
}

function refreshTaskManager(winId){

  const manager = document.getElementById(winId);
  if(!manager) return;

  const list = manager.querySelector('#tmList');
  if(!list) return;

  // 現在チェックされているタスクを保存
  const checkedIds = new Set(
    [...list.querySelectorAll('.tm-check:checked')]
      .map(cb => cb.dataset.id)
  );

  list.innerHTML = '';

  const rows = Object.values(windowsMap);

  rows.forEach(o => {

    const row = document.createElement('div');

    row.className = 'tm-row';
    row.dataset.id = o.id;

    const cpu =
      Math.floor(Math.random() * 8);

    const memory =
      (Math.random() * 4 + 1).toFixed(1);

    row.innerHTML = `

        class="tm-check"
        data-id="${o.id}"
        title="このタスクを選択"

        </span>
      </span>

      <span>
        ${cpu}%
      </span>

      <span>
        ${memory} MB
      </span>
    `;

    const checkbox =
      row.querySelector('.tm-check');

    // 以前チェックされていたタスクなら復元
    if(checkedIds.has(o.id)){
      checkbox.checked = true;
    }

    // チェックボックス操作では行クリックを発生させない
    checkbox.addEventListener('click', e => {

function tmEndSelected(){

  const manager =
    [...document.querySelectorAll('.window')]
      .find(w => w.querySelector('#tmList'));

  if(!manager) return;

  const checked =
    [...manager.querySelectorAll('.tm-check:checked')];

  if(checked.length === 0){
    toast('終了するタスクを選択してください');
    return;
  }

  const targets = checked
    .map(cb => windowsMap[cb.dataset.id])
    .filter(Boolean);

  if(targets.length === 0) return;

  const names = targets
    .map(t => t.title)
    .join('、');

  if(!confirm(
    targets.length === 1
      ? `「${names}」を終了しますか？`
      : `${targets.length} 個のタスクを終了しますか？\n\n${names}`
  )){
    return;
  }

  // タスクマネージャー自身が選択されているか確認
  const managerWillClose =
    targets.some(t => t.id === manager.id);

  // 選択されたタスクをすべて終了
  targets.forEach(target => {
    closeWindow(target.id);
  });

  // タスクマネージャー自身を終了した場合は
  // ここで処理を終了する
  if(managerWillClose){
    toast('タスクを終了しました');
    return;
  }

  // タスクマネージャーが残っている場合だけ更新
  setTimeout(() => {

    if(!windowsMap[manager.id]) return;

    refreshTaskManager(manager.id);
    refreshTaskDetails(manager.id);
    updateTaskManagerStats(manager.id);

  }, 20);

  toast(
    targets.length === 1
      ? 'タスクを終了しました'
      : `${targets.length} 個のタスクを終了しました`
  );
}

function browserGetState(browser){
  if(!browser) return null;

  if(!browser._browserState){
    browser._browserState = {
      nextTabId: 2,
      activeTabId: '1',
      tabs: [{
        id:'1',
        url:'webos://home',
        title:'新しいタブ',
        history:['webos://home'],
        historyIndex:0
      }]
    };
  }

  return browser._browserState;
}

function browserGetActiveTab(browser){
  const state = browserGetState(browser);
  if(!state) return null;

  let tab = state.tabs.find(t => t.id === state.activeTabId);
  if(!tab){
    tab = state.tabs[0];
    if(tab) state.activeTabId = tab.id;
  }
  return tab || null;
}

function browserCreateTab(browser, url='webos://home', title='新しいタブ'){
  const state = browserGetState(browser);
  if(!state) return null;

  const id = String(state.nextTabId++);
  const tab = {
    id,
    url,
    title,
    history:[url],
    historyIndex:0
  };

  state.tabs.push(tab);
  state.activeTabId = id;
  return tab;
}

function browserRenderTabs(browser){
  const state = browserGetState(browser);
  const tabsEl = browser?.querySelector('.browser-tabs');
  if(!state || !tabsEl) return;

  tabsEl.innerHTML = '';

  state.tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = 'browser-tab' +
      (tab.id === state.activeTabId ? ' active' : '');
    el.dataset.tabId = tab.id;

    const icon = document.createElement('span');
    icon.className = 'browser-tab-icon';
    icon.textContent = '🌐';

    const title = document.createElement('span');
    title.className = 'browser-tab-title';
    title.textContent = tab.title || '新しいタブ';

    const close = document.createElement('button');
    close.className = 'browser-tab-close';
    close.title = 'タブを閉じる';
    close.textContent = '×';

    close.addEventListener('click', e => {
      e.stopPropagation();
      browserCloseTab(browser, tab.id);
    });

    el.addEventListener('click', () => {
      browserSwitchTab(browser, tab.id);
    });

    el.append(icon, title, close);
    tabsEl.appendChild(el);
  });

  const newBtn = document.createElement('button');
  newBtn.className = 'browser-new-tab';
  newBtn.title = '新しいタブ';
  newBtn.textContent = '＋';
  newBtn.addEventListener('click', e => {
    e.stopPropagation();
    browserNewTab(browser);
  });
  tabsEl.appendChild(newBtn);
}

function browserGetLocalFilePath(url){
  if(!/^webos:\/\/file\//i.test(String(url || ""))){
    return null;
  }

  try{
    return decodeURIComponent(
      String(url).replace(/^webos:\/\/file\//i, "")
    );
  }catch{
    return null;
  }
}

function browserRenderLocalFile(browser, url){
  const frame = browser?.querySelector(".browser-frame");
  const home = browser?.querySelector(".browser-home");
  const status = browser?.querySelector(".browser-status-text");
  const tab = browserGetActiveTab(browser);

  if(!browser || !frame || !home || !status || !tab) return false;

  const path = browserGetLocalFilePath(url);

  if(!path || !files[path] || files[path].type !== "file"){
    home.style.display = "flex";
    frame.style.display = "none";
    frame.removeAttribute("srcdoc");
    frame.src = "about:blank";
    status.textContent = "HTMLファイルが見つかりません";
    tab.title = "ファイルが見つかりません";
    return true;
  }

  const fileName = path.split("/").pop();

  if(!fileName.toLowerCase().endsWith(".html")){
    home.style.display = "flex";
    frame.style.display = "none";
    frame.removeAttribute("srcdoc");
    frame.src = "about:blank";
    status.textContent = "HTMLファイルではありません";
    tab.title = fileName;
    return true;
  }

  home.style.display = "none";
  frame.style.display = "block";
  status.textContent = "読み込み中…";
  browser.classList.add("loading");

  frame.onload = () => {
    browser.classList.remove("loading");
    status.textContent = "WebOS: " + path;
    tab.title = fileName;
    browserRenderTabs(browser);
    browserUpdateNavButtons(browser);
  };

  // 仮想ファイルシステムのHTMLをiframeで実行
  frame.removeAttribute("src");
  frame.srcdoc = files[path].content;

  return true;
}

function browserRenderCurrentTab(browser){

  const tab =
    browserGetActiveTab(browser);

  if(!browser || !tab) return;

  const address =
    browser.querySelector(
      '.browser-address'
    );

  const frame =
    browser.querySelector(
      '.browser-frame'
    );

  const home =
    browser.querySelector(
      '.browser-home'
    );

  const status =
    browser.querySelector(
      '.browser-status-text'
    );

  if(
    !address ||
    !frame ||
    !home ||
    !status
  ){
    return;
  }

  address.value =
    tab.url;


  /* =========================
     ホーム
  ========================= */

  if(tab.url === 'webos://home'){

    browser.classList.remove(
      'loading'
    );

    frame.onload = null;
    frame.onerror = null;

    frame.removeAttribute(
      'srcdoc'
    );

    frame.src =
      'about:blank';

    frame.style.display =
      'none';

    home.style.display =
      'flex';

    status.textContent =
      'WebOS ホーム';

    browserRenderTabs(browser);
    browserUpdateNavButtons(browser);
    updateBrowserBookmarkState(browser);

    return;
  }


  /* =========================
     WebOS HTMLファイル
  ========================= */

  if(
    tab.url.startsWith(
      'webos://file/'
    )
  ){

    let path = '';

    try{

      path =
        decodeURIComponent(
          tab.url.slice(
            'webos://file/'.length
          )
        );

    }catch(e){

      status.textContent =
        'ファイルURLが不正です';

      return;
    }

    const item =
      files[path];

    home.style.display =
      'none';

    frame.style.display =
      'block';

    frame.onload = null;
    frame.onerror = null;

    frame.removeAttribute(
      'src'
    );

    if(
      item &&
      item.type === 'file'
    ){

      browser.classList.remove(
        'loading'
      );

      frame.srcdoc =
        item.content || '';

      status.textContent =
        'WebOS: ' + path;

      tab.title =
        path.split('/').pop();

    }else{

      browser.classList.remove(
        'loading'
      );

      frame.srcdoc = `
        <!doctype html>
        <html>
        <head>
          <meta charset="UTF-8">
          <title>ファイルが見つかりません</title>
        </head>

        <body style="
          font-family:sans-serif;
          padding:30px;
        ">

          <h2>
            ファイルが見つかりません
          </h2>

          <p>
            ${escapeHtml(path)}
          </p>

        </body>
        </html>
      `;

      status.textContent =
        'ファイルが見つかりません';

      tab.title =
        'ファイルが見つかりません';
    }

    browserRenderTabs(browser);
    browserUpdateNavButtons(browser);
    updateBrowserBookmarkState(browser);

    return;
  }


  /* =========================
     外部Webサイト
  ========================= */

  home.style.display =
    'none';

  frame.style.display =
    'block';

  browser.classList.add(
    'loading'
  );

  status.textContent =
    '読み込み中…';

  frame.onload = () => {

    browser.classList.remove(
      'loading'
    );

    status.textContent =
      tab.url;

    if(
      !tab.title ||
      tab.title === '新しいタブ'
    ){

      tab.title =
        tab.url;
    }

    browserRenderTabs(browser);
    browserUpdateNavButtons(browser);

  };

  frame.onerror = () => {

    browser.classList.remove(
      'loading'
    );

    status.textContent =
      'ページを読み込めませんでした';

  };


  /*
   * srcdocを完全に解除してから
   * 外部URLを設定
   */

  frame.removeAttribute(
    'srcdoc'
  );

  frame.src =
    tab.url;


  browserUpdateNavButtons(
    browser
  );

  updateBrowserBookmarkState(
    browser
  );
}

function browserUpdateNavButtons(browser){
  const tab = browserGetActiveTab(browser);
  if(!browser || !tab) return;

  const buttons = browser.querySelectorAll('.browser-nav');
  if(buttons.length >= 2){
    buttons[0].disabled = tab.historyIndex <= 0;
    buttons[1].disabled = tab.historyIndex >= tab.history.length - 1;
    buttons[0].style.opacity = buttons[0].disabled ? '.4' : '1';
    buttons[1].style.opacity = buttons[1].disabled ? '.4' : '1';
  }
}

function browserRecordHistory(url, title, browser){
  const tab = browserGetActiveTab(browser);
  if(!tab) return;

  const history = tab.history;
  const index = tab.historyIndex;

  const trimmed = history.slice(0, index + 1);

  if(trimmed[trimmed.length - 1] !== url){
    trimmed.push(url);
  }

  tab.history = trimmed;
  tab.historyIndex = trimmed.length - 1;
  tab.url = url;
  tab.title = title || url;

  let globalHistory = browserLoadLocalList('webos_browser_history');
  const now = new Date().toLocaleString('ja-JP');

  globalHistory = [{
    url,
    title: title || url,
    time: now
  }, ...globalHistory.filter(item => item.url !== url)];

  browserSaveLocalList(
    'webos_browser_history',
    globalHistory.slice(0, 100)
  );
}

function getBrowserFromElement(el){
  if(!el) return null;
  return el.closest('.webbrowser') || null;
}

function normalizeBrowserUrl(value){
  value = String(value || '').trim();

  if(!value) return '';
  if(value === 'webos://home') return value;
  if(/^webos:\/\/file\//i.test(value)) return value;
  if(/^https?:\/\//i.test(value)) return value;

  if(/^(localhost|127\.0\.0\.1)(:\d+)?(\/.*)?$/i.test(value)){
    return 'http://' + value;
  }

  if(/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(value)){
    return 'https://' + value;
  }

  return 'https://www.google.com/search?q=' +
    encodeURIComponent(value);
}

function browserGo(el, forcedUrl = null, fromHistory = false){

  const browser = getBrowserFromElement(el);
  if(!browser) return;

  const address =
    browser.querySelector('.browser-address');

  const frame =
    browser.querySelector('.browser-frame');

  const home =
    browser.querySelector('.browser-home');

  const status =
    browser.querySelector('.browser-status-text');

  const tab =
    browserGetActiveTab(browser);

  if(!address || !frame || !home || !status || !tab){
    return;
  }

  const raw =
    forcedUrl !== null
      ? String(forcedUrl)
      : address.value.trim();

  if(!raw) return;

  const url =
    normalizeBrowserUrl(raw);

  if(!url) return;

  address.value = url;

  if(!fromHistory){

    browserRecordHistory(
      url,
      url,
      browser
    );

  }else{

    tab.url = url;
  }

  browserRenderCurrentTab(browser);
}

function browserSwitchTab(browser, tabId){
  const state = browserGetState(browser);
  if(!state) return;

  const tab = state.tabs.find(t => t.id === tabId);
  if(!tab) return;

  state.activeTabId = tabId;
  browserClosePanel(browser);
  browserRenderCurrentTab(browser);
}

function browserNewTab(elOrBrowser){
  const browser = elOrBrowser?.classList?.contains('webbrowser')
    ? elOrBrowser
    : getBrowserFromElement(elOrBrowser);

  if(!browser) return;

  setTimeout(() => {
    const address = browser.querySelector('.browser-address');

      address.select();
    }
  },30);
}

function browserCloseTab(el, tabId){

  const browser = getBrowserFromElement(el);
  if(!browser) return;

  const state = browser._browserState;
  if(!state) return;

  /*
   * 最後のタブなら
   * ブラウザウィンドウ自体を閉じる
   */
  if(state.tabs.length <= 1){

    const win =
      browser.closest('.window');

    if(win){

      const winId =
        win.id;

      if(typeof closeWindow === 'function'){

        closeWindow(winId);

      }else{

        win.remove();
      }
    }

    return;
  }

  /*
   * 通常のタブ閉じる処理
   */

  const index =
    state.tabs.findIndex(
      tab => tab.id === String(tabId)
    );

  if(index === -1) return;

  state.tabs.splice(
    index,
    1
  );

  /*
   * 閉じたタブが現在のタブなら
   * 前のタブへ移動
   */
  if(
    state.activeTabId ===
    String(tabId)
  ){

    const newIndex =
      Math.max(
        0,
        index - 1
      );

    state.activeTabId =
      state.tabs[newIndex].id;
  }

  browserRenderTabs(browser);
  browserRenderCurrentTab(browser);
  browserUpdateNavButtons(browser);
}

function browserBack(el){
  const browser = getBrowserFromElement(el);
  const tab = browserGetActiveTab(browser);
  if(!browser || !tab || tab.historyIndex <= 0) return;

  tab.historyIndex--;
  const url = tab.history[tab.historyIndex];

  browserGo(el, url, true);
}

function browserForward(el){
  const browser = getBrowserFromElement(el);
  const tab = browserGetActiveTab(browser);
  if(!browser || !tab ||
     tab.historyIndex >= tab.history.length - 1) return;

  tab.historyIndex++;
  const url = tab.history[tab.historyIndex];

  browserGo(el, url, true);
}

function browserHome(el){
  const browser = getBrowserFromElement(el);
  const tab = browserGetActiveTab(browser);
  if(!browser || !tab) return;

  tab.url = 'webos://home';
  tab.title = '新しいタブ';
  tab.history = ['webos://home'];
  tab.historyIndex = 0;

  const address = browser.querySelector('.browser-address');
  const frame = browser.querySelector('.browser-frame');
  const home = browser.querySelector('.browser-home');
  const status = browser.querySelector('.browser-status-text');

  if(address) address.value = 'webos://home';
  if(frame){
    frame.src = 'about:blank';
    frame.style.display = 'none';
  }
  if(home) home.style.display = 'flex';
  if(status) status.textContent = 'WebOS ホーム';

  browserClosePanel(browser);
  browserRenderTabs(browser);
  browserUpdateNavButtons(browser);
}

function browserReload(el){
  const browser = getBrowserFromElement(el);
  if(!browser) return;

  const frame = browser.querySelector('.browser-frame');
  const address = browser.querySelector('.browser-address');
  const tab = browserGetActiveTab(browser);

  if(!frame || !address || !tab) return;

  if(address.value === 'webos://home'){
    browserHome(el);
    return;
  }

  if(browserGetLocalFilePath(tab.url)){
    browserRenderLocalFile(browser, tab.url);
    return;
  }

  browser.classList.add('loading');
  browser.querySelector('.browser-status-text').textContent =
    '再読み込み中…';

  try{
    frame.contentWindow.location.reload();
  }catch{
    frame.src = frame.src;
  }
}
