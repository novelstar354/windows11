function browserMigrateBookmarks(){
  const currentKey = 'webos_browser_bookmarks';
  const oldKey = 'webos10_browser_bookmarks';
  try{
    const current = JSON.parse(localStorage.getItem(currentKey) || '[]');
    const old = JSON.parse(localStorage.getItem(oldKey) || '[]');
    if(!Array.isArray(current) || !Array.isArray(old) || old.length === 0) return;

    const merged = [...current];
    old.forEach(item => {
      const normalized = typeof item === 'string'
        ? {url:item, title:item}
        : item && item.url
          ? {url:String(item.url), title:String(item.title || item.url)}
          : null;
      if(normalized && !merged.some(x => x && x.url === normalized.url)){
        merged.push(normalized);
      }
    });
    localStorage.setItem(currentKey, JSON.stringify(merged));
  }catch{}
}

browserMigrateBookmarks();

function browserGetBookmarks(){
  const KEY = 'webos_browser_bookmarks';
  try{
    const value = JSON.parse(localStorage.getItem(KEY) || '[]');
    if(!Array.isArray(value)) return [];

    return value
      .map(item => {
        if(typeof item === 'string') return {url:item, title:item};
        if(item && typeof item === 'object' && item.url){
          return {
            url:String(item.url),
            title:String(item.title || item.url)
          };
        }
        return null;
      })
      .filter(Boolean);
  }catch{
    return [];
  }
}

function browserSaveBookmarks(bookmarks){
  try{
    localStorage.setItem(
      'webos_browser_bookmarks',
      JSON.stringify(bookmarks)
    );
  }catch{}
}

function browserIsBookmarked(url){
  if(!url || url === 'webos://home') return false;
  return browserGetBookmarks().some(item => item.url === url);
}

function browserUpdateBookmarkMenu(browser){
  if(!browser) return;

  const menu = browser.querySelector('.browser-popup-menu');
  if(!menu) return;

  const button = [...menu.querySelectorAll('button')]
    .find(btn => btn.getAttribute('onclick')?.includes('browserBookmark'));

  if(!button) return;

  const address = browser.querySelector('.browser-address');
  const url = normalizeBrowserUrl(address?.value || '');
  const bookmarked = browserIsBookmarked(url);

  button.textContent = bookmarked
    ? '★ お気に入りから削除'
    : '☆ お気に入りに追加';
}

function browserBookmark(el){
  const browser = getBrowserFromElement(el);
  if(!browser) return;

  const address = browser.querySelector('.browser-address');
  const star = browser.querySelector('.browser-star');
  const tab = browserGetActiveTab(browser);
  const url = normalizeBrowserUrl(address?.value || tab?.url || '');

  if(!url || url === 'webos://home'){
    toast('ホームページはお気に入りに追加できません');
    return;
  }

  const bookmarks = browserGetBookmarks();
  const index = bookmarks.findIndex(item => item.url === url);

  if(index >= 0){
    bookmarks.splice(index, 1);
    toast('お気に入りから削除しました');
  }else{
    bookmarks.unshift({
      url,
      title: tab?.title && tab.title !== '新しいタブ'
        ? tab.title
        : url
    });
    toast('お気に入りに追加しました');
  }

  browserSaveBookmarks(bookmarks);
  updateBrowserBookmarkState(browser);
  browserUpdateBookmarkMenu(browser);

  const panel = browser.querySelector('.browser-browser-panel');
  if(panel?.classList.contains('show') && panel.dataset.type === 'favorites'){
    browserShowPanel(browser,'favorites');
  }
}

function updateBrowserBookmarkState(browser){
  if(!browser) return;

  const star = browser.querySelector('.browser-star');
  const address = browser.querySelector('.browser-address');
  if(!star || !address) return;

  const url = normalizeBrowserUrl(address.value || '');
  const bookmarked = browserIsBookmarked(url);

  star.classList.toggle('bookmarked', bookmarked);
  star.textContent = bookmarked ? '★' : '☆';
  star.title = bookmarked
    ? 'お気に入りから削除'
    : 'お気に入りに追加';

  browserUpdateBookmarkMenu(browser);
}
function browserMenu(el){
  const browser = getBrowserFromElement(el);
  if(!browser) return;

  const menu = browser.querySelector('.browser-popup-menu');
  if(!menu) return;

  menu.classList.toggle('show');
}

function browserShowPanel(elOrBrowser,type){
  const browser = elOrBrowser?.classList?.contains('webbrowser')
    ? elOrBrowser
    : getBrowserFromElement(elOrBrowser);

  if(!browser) return;

  const menu = browser.querySelector('.browser-popup-menu');
  if(menu) menu.classList.remove('show');

  const panel = browser.querySelector('.browser-browser-panel');
  const title = browser.querySelector('.browser-panel-title');
  const body = browser.querySelector('.browser-panel-body');
  const clear = browser.querySelector('.browser-panel-clear');

  if(!panel || !title || !body || !clear) return;

  panel.dataset.type = type;
  title.textContent = type === 'favorites'
    ? '⭐ お気に入り'
    : '🕘 履歴';

  clear.textContent = type === 'favorites'
    ? 'お気に入りをすべて削除'
    : '履歴をすべて削除';

  body.innerHTML = '';

  const key = type === 'favorites'
    ? 'webos_browser_bookmarks'
    : 'webos_browser_history';

  const list = browserLoadLocalList(key);

  if(list.length === 0){
    const empty = document.createElement('div');
    empty.className = 'browser-panel-empty';
    empty.textContent = type === 'favorites'
      ? 'お気に入りはありません'
      : '履歴はありません';
    body.appendChild(empty);
  }else{
    list.forEach((item,index) => {
      const row = document.createElement('div');
      row.className = 'browser-list-item';

      const icon = document.createElement('span');
      icon.className = 'browser-list-icon';
      icon.textContent = type === 'favorites' ? '⭐' : '🕘';

      const main = document.createElement('span');
      main.className = 'browser-list-main';

      const itemTitle = document.createElement('span');
      itemTitle.className = 'browser-list-title';
      itemTitle.textContent = item.title || item.url;

      const url = document.createElement('span');
      url.className = 'browser-list-url';
      url.textContent = item.url;

      main.append(itemTitle,url);

      if(item.time){
        const time = document.createElement('span');
        time.className = 'browser-list-time';
        time.textContent = item.time;
        main.appendChild(time);
      }

      const del = document.createElement('button');
      del.className = 'browser-list-delete';
      del.title = type === 'favorites' ? '削除' : 'この履歴を削除';
      del.textContent = '×';

      del.addEventListener('click', e => {
        e.stopPropagation();

        const current = browserLoadLocalList(key);
        current.splice(index,1);
        browserSaveLocalList(key,current);

        browserShowPanel(browser,type);
      });

      row.append(icon,main,del);

      row.addEventListener('click', e => {
        if(e.target === del) return;

        const address = browser.querySelector('.browser-address');
        if(address){
          address.value = item.url;
          browserGo(address);
        }

        browserClosePanel(browser);
      });

      body.appendChild(row);
    });
  }

  clear.onclick = () => {
    browserSaveLocalList(key,[]);
    browserShowPanel(browser,type);
    showToast(
      type === 'favorites'
        ? 'お気に入りをすべて削除しました'
        : '履歴をすべて削除しました'
    );
  };

  panel.classList.add('show');
}

function browserClosePanel(elOrBrowser){
  const browser = elOrBrowser?.classList?.contains('webbrowser')
    ? elOrBrowser
    : getBrowserFromElement(elOrBrowser);

  if(!browser) return;

  const panel = browser.querySelector('.browser-browser-panel');
  if(panel) panel.classList.remove('show');
}

function browserCopyUrl(el){
  const browser = getBrowserFromElement(el);
  if(!browser) return;

  const address = browser.querySelector('.browser-address');
  if(!address) return;

  navigator.clipboard?.writeText(address.value)
    .then(() => showToast('URLをコピーしました'))
    .catch(() => {});

  const menu = browser.querySelector('.browser-popup-menu');
  if(menu) menu.classList.remove('show');
}

function browserNewWindow(el){
  const browser = getBrowserFromElement(el);
  const menu = browser?.querySelector('.browser-popup-menu');
  if(menu) menu.classList.remove('show');

  setTimeout(() => {
    openBrowser();
  },50);
}

document.addEventListener('mousedown', function(e){
  document.querySelectorAll('.browser-popup-menu.show').forEach(menu => {
    if(menu.contains(e.target)) return;
    if(e.target.closest('.browser-menu')) return;
    menu.classList.remove('show');
  });

  document.querySelectorAll('.browser-browser-panel.show').forEach(panel => {
    if(panel.contains(e.target)) return;

    const browser = panel.closest('.webbrowser');
    if(e.target.closest('.browser-menu')) return;
    if(e.target.closest('.browser-popup-menu')) return;

    browserClosePanel(browser);
  });
});

function restoreFromCode(){

  const input =
    document.getElementById('restorationCodeInput');

  if(!input){
    toast('復元コード入力欄が見つかりません');
    return;
  }

  const code = input.value.trim();

  if(!code){
    toast('復元コードを入力してください');
    return;
  }

  try{

    /*
     * restoration コマンドで生成された
     * webosRestorationData を取り出す
     */
    const match = code.match(
      /const\s+webosRestorationData\s*=\s*([\s\S]*?);\s*(?:localStorage|$)/
    );

    if(!match){
      throw new Error(
        '復元コードの形式が正しくありません'
      );
    }

    const data =
      JSON.parse(match[1]);

    if(!data || typeof data !== 'object'){
      throw new Error(
        '復元データがありません'
      );
    }

    /*
     * 設定
     */
    if(data.config !== undefined){
      localStorage.setItem(
        'webos10_config_v1',
        JSON.stringify(data.config)
      );
    }

    /*
     * アプリの位置
     */
    if(data.desktopPositions !== undefined){
      localStorage.setItem(
        'webos10_desktop_positions_v1',
        JSON.stringify(data.desktopPositions)
      );
    }

    /*
     * ホーム画面のファイル
     */
    if(data.desktopItems !== undefined){
      localStorage.setItem(
        'webos10_desktop_items_v1',
        JSON.stringify(data.desktopItems)
      );
    }

    /*
     * ゴミ箱
     */
    if(data.desktopTrash !== undefined){
      localStorage.setItem(
        'webos10_desktop_trash_v1',
        JSON.stringify(data.desktopTrash)
      );
    }

    toast('設定を復元しました');

    setTimeout(() => {
      location.reload();
    }, 700);

  }catch(err){

    console.error(err);

    toast(
      '復元に失敗しました: ' +
      err.message
    );
  }
}

/* ==========================================================
   独自JavaScript API
   テキストエディターから使えるAPI:
   OS.window(title, html, options)
   OS.close(id)
   OS.toast(text)
   OS.openApp(name)
   OS.writeFile(name,text)
   OS.readFile(name)
   OS.listFiles()
   OS.lock()
   ========================================================== */
window.OS = {

  window(title, html, options = {}) {
    return makeWindow(
      title,
      html,
      "🧩",
      options
    );
  },

  close(id) {
    closeWindow(id);
  },

  toast,

  openApp,

  lock,

  mkdir(path) {

    path = normalizePath(path);

    if(!path) return false;

    if(files[path] !== undefined)
      return false;

    files[path] = {
      type: "folder"
    };

    saveFiles();

    return true;
  },

  writeFile(name, text) {

    name = normalizePath(name);

    files[name] = {
      type: "file",
      content: String(text)
    };

    saveFiles();

    return true;
  },

  readFile(name) {

    name = normalizePath(name);

    if(!files[name])
      return null;

    if(files[name].type !== "file")
      return null;

    return files[name].content;
  },

  delete(path) {

    path = normalizePath(path);

    if(!files[path])
      return false;

    if(files[path].type === "folder"){

      const prefix =
        path + "/";

      Object.keys(files)
        .filter(x =>
          x.startsWith(prefix)
        )
        .forEach(x =>
          delete files[x]
        );
    }

    delete files[path];

    saveFiles();

    return true;
  },

  listFiles() {

    return Object.keys(files);
  },

  listFolder(folder = "") {

  folder = normalizePath(folder);

  const result = [];

  Object.keys(files).forEach(path => {

    const parts = path.split("/");
    const parent = parts.slice(0,-1).join("/");

    if(parent !== folder)
      return;

    result.push({
      name: parts[parts.length - 1],
      path: path,
      type: files[path].type
    });

  });

  return result;
},

  html(s) {

    return escapeHtml(s);

  }

};

const desktopItemsStorageKey = 'webos10_desktop_items_v1';
let desktopItems = JSON.parse(localStorage.getItem(desktopItemsStorageKey) || '[]');

function saveDesktopItems(){
  localStorage.setItem(desktopItemsStorageKey, JSON.stringify(desktopItems));

function desktopItemKey(path){ return normalizePath(path); }
function desktopItemIcon(path){
  const item = files[path];
  if(!item) return '📄';
  return item.type === 'folder' ? '📁' : getFileIcon(path.split('/').pop());
}
function findFreeDesktopPosition(){
  const icons = document.querySelectorAll(
    '#desktopIcons .icon'
  );

  const positions = [];

  icons.forEach(el => {
    if(el.id === 'trashIcon') return;

    const x = parseFloat(el.style.left);
    const y = parseFloat(el.style.top);

    if(Number.isFinite(x) && Number.isFinite(y)){
      positions.push({x, y});
    }
  });

  // 1列10個、最大20行
  const colWidth = 90;
  const rowHeight = 94;

  const startX = 190;
  const startY = 12;

  for(let row = 0; row < 20; row++){
    for(let col = 0; col < 10; col++){

      const x = startX + col * colWidth;
      const y = startY + row * rowHeight;

      // 他のアイコンと重なっていないか確認
      const occupied = positions.some(pos => {

        const dx = Math.abs(pos.x - x);
        const dy = Math.abs(pos.y - y);

        return dx < 80 && dy < 85;
      });

      if(!occupied){
        return {x, y};
      }
    }
  }

  // 全部埋まっていた場合
  return {
    x: startX,
    y: startY + 20 * rowHeight
  };
}
function putFileOnDesktop(path,silent=false){
  path=desktopItemKey(path);
  if(!path || !files[path]){ if(!silent) toast('ファイルまたはフォルダが見つかりません'); return false; }
  if(desktopItems.some(x=>x.path===path)){ if(!silent) toast('すでにホーム画面にあります'); return false; }
  const pos=findFreeDesktopPosition();
  desktopItems.push({path,name:path.split('/').pop(),type:files[path].type,icon:desktopItemIcon(path),x:pos.x,y:pos.y});
  saveDesktopItems();
  renderDesktopItems();
  if(!silent) toast(path.split('/').pop()+' をホーム画面に置きました');
  return true;
}
function removeFileFromDesktop(path,silent=false){
  path=desktopItemKey(path);
  const before=desktopItems.length;
  desktopItems=desktopItems.filter(x=>x.path!==path);
  if(before===desktopItems.length){ if(!silent) toast('ホーム画面にありません'); return false; }
  saveDesktopItems(); renderDesktopItems();
  if(!silent) toast('ホーム画面から外しました');
  return true;
}

  else openFile(path);

function renderDesktopItems(){
  const icons = document.getElementById('desktopIcons');

  if(!icons) return;

  // 以前のファイル・フォルダアイコンを削除
  icons
    .querySelectorAll('.desktop-user-item')
    .forEach(el => el.remove());

  desktopItems.forEach(item => {

    if(!item || !item.path) return;
    if(!files[item.path]) return;

    const el = document.createElement('div');

    el.className = 'icon desktop-user-item';
    el.dataset.desktopPath = item.path;

    el.style.position = 'absolute';
    el.style.left =
      (Number.isFinite(item.x) ? item.x : 190) + 'px';
    el.style.top =
      (Number.isFinite(item.y) ? item.y : 12) + 'px';

    el.innerHTML = `
      <div class="ico">
        ${escapeHtml(item.icon || desktopItemIcon(item.path))}
      </div>
      <span>
        ${escapeHtml(
          item.name || item.path.split('/').pop()
        )}
      </span>
    `;

    /*
     * =========================
     * ダブルクリック
     * =========================
     */
    el.addEventListener('dblclick', () => {
      openDesktopItem(item.path);
    });

    /*
     * =========================
     * ドラッグ
     * =========================
     */
    let dragging = false;
    let moved = false;
    let offsetX = 0;
    let offsetY = 0;

    el.addEventListener('mousedown', e => {

      if(e.button !== 0) return;

      const rect = el.getBoundingClientRect();

      dragging = true;
      moved = false;

      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;

      el.style.zIndex = 1000;

      e.preventDefault();
      e.stopPropagation();
    });

    const onMouseMove = e => {

      if(!dragging) return;

      moved = true;

      const newX = e.clientX - offsetX;
      const newY = e.clientY - offsetY;

      item.x = Math.max(0, newX);
      item.y = Math.max(0, newY);

      el.style.left = item.x + 'px';
      el.style.top = item.y + 'px';

      /*
       * ゴミ箱の上に来たらハイライト
       */
      const trash = document.getElementById('trashIcon');

      if(trash){

        const r = trash.getBoundingClientRect();

        const over =
          e.clientX >= r.left &&
          e.clientX <= r.right &&
          e.clientY >= r.top &&
          e.clientY <= r.bottom;

        trash.classList.toggle('drag-over', over);
      }
    };

    const onMouseUp = e => {

      if(!dragging) return;

      dragging = false;

      el.style.zIndex = '';

      /*
       * ゴミ箱に入れる
       */
      const trash = document.getElementById('trashIcon');

      if(trash){

        const r = trash.getBoundingClientRect();

        const over =
          e.clientX >= r.left &&
          e.clientX <= r.right &&
          e.clientY >= r.top &&
          e.clientY <= r.bottom;

        trash.classList.remove('drag-over');

        if(over){
          moveDesktopIconToTrash(el);
          return;
        }
      }

      /*
       * 移動した位置を保存
       */
      if(moved){
        saveDesktopItems();
      }

      moved = false;
    };

    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);

    icons.appendChild(el);
  });
}

function updateDesktopItemPath(oldPath,newPath){
  oldPath=desktopItemKey(oldPath); newPath=desktopItemKey(newPath);
  let changed=false;
  const prefix=oldPath+'/';
  desktopItems.forEach(item=>{
    if(item.path===oldPath){ item.path=newPath;item.name=newPath.split('/').pop();item.type=files[newPath]?.type||item.type;item.icon=desktopItemIcon(newPath);changed=true; }
    else if(item.path.startsWith(prefix)){ const rel=item.path.slice(prefix.length);item.path=newPath+'/'+rel;item.name=item.path.split('/').pop();item.type=files[item.path]?.type||item.type;item.icon=desktopItemIcon(item.path);changed=true; }
  });
  if(changed){ saveDesktopItems();renderDesktopItems(); }
}
function clearDesktopItemsForPath(path){
  path=desktopItemKey(path); const prefix=path+'/'; const before=desktopItems.length;
  desktopItems=desktopItems.filter(item=>item.path!==path&&!item.path.startsWith(prefix));
  if(before!==desktopItems.length){ saveDesktopItems();renderDesktopItems(); }
}

  localStorage.setItem(trashStorageKey, JSON.stringify(desktopTrash));

function getDesktopIconMeta(el){

  // ファイル・フォルダ
  if(el.dataset.desktopPath){

    const path = normalizePath(el.dataset.desktopPath);
    const file = files[path];

    return {
      kind: 'file',
      path: path,
      icon: file ? desktopItemIcon(path) : '📄',
      name: path.split('/').pop(),
      type: file?.type || 'file'
    };
  }

  // アプリ
  if(el.dataset.app){

    return {
      kind: 'app',
      app: el.dataset.app,
      icon: el.querySelector('.ico')?.textContent || '📄',
      name: el.querySelector('span')?.textContent ||
            el.dataset.app
    };
  }

  return null;
}

function renderTrash(){

  if(!list)return;

function restoreDesktopIcon(index){
  const item = desktopTrash[index];

  if(!item) return;

  /*
   * =========================
   * アプリを復元
   * =========================
   */
  if(item.kind === 'app' || item.app){

    const app = item.app;

    // すでにホーム画面にある場合
    if(document.querySelector(
      `#desktopIcons .icon[data-app="${CSS.escape(app)}"]`
    )){
      desktopTrash.splice(index, 1);
      saveDesktopTrash();
      renderTrash();

      toast(item.name + ' はすでにホーム画面にあります');
      return;
    }

    const icons = document.getElementById('desktopIcons');

    if(!icons) return;

    const el = document.createElement('div');

    el.className = 'icon';
    el.dataset.app = app;

    el.innerHTML = `
      <div class="ico">${escapeHtml(item.icon || '📄')}</div>
      <span>${escapeHtml(item.name || app)}</span>
    `;

    el.ondblclick = () => openApp(app);

    icons.appendChild(el);

    // 保存済み位置を削除して初期位置へ
    delete desktopPositions[app];
    saveDesktopPositions();

    // ドラッグ機能を初期化
    initOneDesktopIcon(el);

    // ゴミ箱から削除
    desktopTrash.splice(index, 1);
    saveDesktopTrash();

    renderTrash();

    toast(item.name + ' を復元しました');

    return;
  }


  /*
   * =========================
   * ファイル・フォルダを復元
   * =========================
   */
  if(item.kind === 'file'){

    const path = normalizePath(item.path);

    // 元ファイルが存在しない
    if(!files[path]){
      desktopTrash.splice(index, 1);
      saveDesktopTrash();
      renderTrash();

      toast('元のファイルが存在しません');
      return;
    }

    // 同じファイルを二重にホーム画面へ置かない
    if(desktopItems.some(x => x.path === path)){
      desktopTrash.splice(index, 1);
      saveDesktopTrash();
      renderTrash();

      toast('すでにホーム画面にあります');
      return;
    }

    /*
     * フォルダの場合も「フォルダ自身」だけを登録。
     * 中身は登録しない。
     */
    const pos = findFreeDesktopPosition();

    desktopItems.push({
      path: path,
      name: path.split('/').pop(),
      type: files[path].type,
      icon: desktopItemIcon(path),
      x: pos.x,
      y: pos.y
    });

    saveDesktopItems();

    desktopTrash.splice(index, 1);
    saveDesktopTrash();

    renderDesktopItems();
    renderTrash();

    toast(
      path.split('/').pop() +
      ' をホーム画面に復元しました'
    );

    return;
  }

  /*
   * 古い形式のデータにも対応
   */
  if(item.path){

    const path = normalizePath(item.path);

    if(!files[path]){
      desktopTrash.splice(index, 1);
      saveDesktopTrash();
      renderTrash();

      toast('元のファイルが存在しません');
      return;
    }

    if(!desktopItems.some(x => x.path === path)){

      const pos = findFreeDesktopPosition();

      desktopItems.push({
        path: path,
        name: path.split('/').pop(),
        type: files[path].type,
        icon: desktopItemIcon(path),
        x: pos.x,
        y: pos.y
      });

      saveDesktopItems();
    }

    desktopTrash.splice(index, 1);
    saveDesktopTrash();

    renderDesktopItems();
    renderTrash();

    toast(path.split('/').pop() + ' を復元しました');
  }
}
function moveDesktopIconToTrash(el){
  if(!el || el.dataset.trash === 'true') return;

  const item = getDesktopIconMeta(el);

  if(!item) return;

  // 重複防止
  const exists = desktopTrash.some(x => {

    if(item.kind === 'app'){
      return x.kind === 'app' && x.app === item.app;
    }

    if(item.kind === 'file'){
      return x.kind === 'file' && x.path === item.path;
    }

    return false;
  });

  if(!exists){
    desktopTrash.push(item);
  }

  /*
   * アプリ
   */
  if(item.kind === 'app'){

    delete desktopPositions[item.app];

    saveDesktopPositions();

    el.remove();
  }

  /*
   * ファイル・フォルダ
   */
  else if(item.kind === 'file'){

    desktopItems = desktopItems.filter(
      x => x.path !== item.path
    );

    saveDesktopItems();

    el.remove();
  }

  saveDesktopTrash();

  document
    .getElementById('trashIcon')
    ?.classList.remove('drag-over');

  renderTrash();

  toast(item.name + ' をゴミ箱に入れました');
}
const desktopPositionsKey='webos10_desktop_positions_v1';
let desktopPositions=JSON.parse(localStorage.getItem(desktopPositionsKey)||'null')||{};
function saveDesktopPositions(){localStorage.setItem(desktopPositionsKey,JSON.stringify(desktopPositions))}
function initOneDesktopIcon(el){
  const key = el.dataset.app;
  if(!key) return;

  // ホーム画面の初期配置
  const positions = {
  // 1行目
  explorer:    {x: 12,  y: 106},
  editor:      {x: 12, y: 200},
  terminal:    {x: 90, y: 106},
  calculator:  {x: 12, y: 294},

  // 2行目
  browser:     {x: 12,  y: 388},
  taskmgr:     {x: 90,  y: 12},
  settings:    {x: 90,  y: 200}
};

// 保存済みの位置がなければ初期位置を使用
if(!desktopPositions[key] && positions[key]){
  desktopPositions[key] = positions[key];
}

  // 念のため位置がないアイコンは左上に配置
  if(!desktopPositions[key]){
    desktopPositions[key] = {x: 12, y: 12};
  }

  applyIconPosition(el);

  let dragging = false;
  let dx = 0;
  let dy = 0;

  el.addEventListener('mousedown', e => {
    if(e.button !== 0 || el.dataset.trash === 'true') return;

    dragging = true;

    const r = el.getBoundingClientRect();

    dx = e.clientX - r.left;
    dy = e.clientY - r.top;

    el.style.zIndex = 20;

    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if(!dragging) return;

    const trash = document.getElementById('trashIcon');
    const tr = trash?.getBoundingClientRect();

    if(
      tr &&
      e.clientX >= tr.left &&
      e.clientX <= tr.right &&
      e.clientY >= tr.top &&
      e.clientY <= tr.bottom
    ){
      trash.classList.add('drag-over');
    }else{
      trash?.classList.remove('drag-over');
    }

    const d = desktopPositions[key];

    d.x = Math.max(
      0,
      Math.min(innerWidth - 90, e.clientX - dx)
    );

    d.y = Math.max(
      0,
      Math.min(innerHeight - 100, e.clientY - dy)
    );

    applyIconPosition(el);
  });

  document.addEventListener('mouseup', e => {
    if(!dragging) return;

    dragging = false;

    const trash = document.getElementById('trashIcon');
    const tr = trash?.getBoundingClientRect();

    const over =
      tr &&
      e.clientX >= tr.left &&
      e.clientX <= tr.right &&
      e.clientY >= tr.top &&
      e.clientY <= tr.bottom;

    trash?.classList.remove('drag-over');

    if(over){
      moveDesktopIconToTrash(el);
    }else{
      saveDesktopPositions();
    }
  });
}
function initDesktopIcons(){
 document.querySelectorAll('.icon[data-app]').forEach(initOneDesktopIcon);
}

function applyIconPosition(el){
 const p=desktopPositions[el.dataset.app];
 if(!p) return;
 el.style.left=p.x+'px';el.style.top=p.y+'px';
}
window.addEventListener('resize',()=>{
 document.querySelectorAll('.icon[data-app]').forEach(applyIconPosition);
});

function updateClock(){
 const d=new Date();
 const time=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
 const date=d.toLocaleDateString('ja-JP',{month:'2-digit',day:'2-digit'});
 document.getElementById('clock').textContent=time;
 document.getElementById('lockTime').textContent=time+'　'+date;
}
setInterval(updateClock,1000);updateClock();

renderDesktopItems();
updateUsername();

document.addEventListener('mousedown', function(e){

  const panel =
    document.getElementById('quickPanel');

  const quickBtn =
    document.getElementById('quickBtn');

  if(!panel) return;

  if(
    panel.classList.contains('show') &&
    !panel.contains(e.target) &&
    !quickBtn.contains(e.target)
  ){

    closeQuickSettings();

  }

});
let ctrlAltTriggered = false;

document.addEventListener('keydown', function(e){

  // Windowsキー
  if(e.key === 'Meta' || e.key === 'OS'){

    e.preventDefault();

    if(!e.repeat){
      toggleStart();
    }

    return;
  }

  // Ctrl + Alt
  if(e.ctrlKey && e.altKey){

    e.preventDefault();

    if(!ctrlAltTriggered){

      ctrlAltTriggered = true;

      toggleStart();

    }

  }

});

document.addEventListener('keyup', function(e){

  if(
    e.key === 'Control' ||
    e.key === 'Alt'
  ){

    ctrlAltTriggered = false;

  }

});

   デスクトップアイコンの初期配置修正版

(function fixDesktopIconPositions(){

  const positions = {
  // 1行目
  trash: {x:12, y:12},
  explorer:    {x: 12,  y: 106},
  editor:      {x: 12, y: 200},
  terminal:    {x: 90, y: 106},
  calculator:  {x: 12, y: 294},

  // 2行目
  browser:     {x: 12,  y: 388},
  taskmgr:     {x: 90,  y: 12},
  settings:    {x: 90,  y: 200}
};

  document.querySelectorAll('#desktopIcons .icon[data-app]').forEach(icon => {

    const app = icon.dataset.app;

    if(app && positions[app]){
      icon.style.left = positions[app].x + 'px';
      icon.style.top  = positions[app].y + 'px';
    }

  });

  // ゴミ箱
  const trash = document.getElementById('trashIcon');

  if(trash){
    trash.style.left = positions.trash.x + 'px';
    trash.style.top  = positions.trash.y + 'px';
  }

})();
