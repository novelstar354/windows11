    .forEach(group => {

  const group =

  updateTaskGroup(appKey);

  /*

  const remaining =

function getTaskAppKey(title){

  if(title.includes('ファイル エクスプローラー'))
    return 'explorer';

  if(title.includes('テキスト エディター'))
    return 'editor';

  if(title.includes('ターミナル'))
    return 'terminal';

  if(title.includes('電卓'))
    return 'calculator';

  if(title.includes('ブラウザ'))
    return 'browser';

  if(title.includes('タスク マネージャー'))
    return 'taskmgr';

  if(title.includes('クイック設定'))
    return 'quick';

  if(title.includes('設定'))
    return 'settings';

  if(title.includes('WebOS 10 について'))
    return 'about';

  return title;
}

function getAppWindowIds(appKey){

  return Object.values(windowsMap)
    .filter(o =>
      getTaskAppKey(o.title) === appKey

    .map(o => o.id);
}

function positionTaskPreview(group){

  const preview =
    group.querySelector('.task-preview');

  if(!preview) return;

  const button =
    group.querySelector('.task');

  if(!button) return;

  // 表示状態にしてサイズを取得
  const oldVisibility = preview.style.visibility;
  const oldOpacity = preview.style.opacity;

  preview.style.visibility = 'hidden';

    preview.getBoundingClientRect();

  let left =
    rect.left +
    rect.width / 2 -
    previewRect.width / 2;

  // 左にはみ出さない
  if(left < margin){
    left = margin;
  }

  // 右にはみ出さない
  if(left + previewRect.width >
     window.innerWidth - margin){

    left =
      window.innerWidth -
      previewRect.width -
      margin;
  }

  // 下からの位置
  const bottom =
    window.innerHeight -
    rect.top +
    5;

  preview.style.left =
    Math.round(left) + 'px';

  preview.style.bottom =
    Math.round(bottom) + 'px';

  preview.style.right =
    'auto';

  preview.style.visibility =
    oldVisibility;

  preview.style.opacity =
    oldOpacity;

  preview.style.pointerEvents =
    '';
}

function makeDraggable(w,bar){
  let drag=false,dx=0,dy=0;
  bar.addEventListener('mousedown',e=>{
    if(e.target.closest('button')||w.classList.contains('max'))return;
    drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;focusWindow(w.id)
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    const maxX=innerWidth-w.offsetWidth,maxY=innerHeight-48-w.offsetHeight;
    w.style.left=Math.max(0,Math.min(maxX,e.clientX-dx))+'px';
    w.style.top=Math.max(0,Math.min(maxY,e.clientY-dy))+'px';
  });
  document.addEventListener('mouseup',()=>drag=false);
  bar.addEventListener('dblclick',e=>{if(!e.target.closest('button'))maximizeWindow(w.id)})
}

/* =========================
   パス関連
========================= */

function normalizePath(path){
  return String(path || "")
    .replace(/\\/g, "/")
    .replace(/^\/+|\/+$/g, "");
}

function joinPath(folder, name){
  folder = normalizePath(folder);
  name = normalizePath(name);

  return folder ? folder + "/" + name : name;
}

/* =========================
   現在のフォルダにある項目だけ取得
========================= */

function getCurrentFolderItems(){
  const result = [];

  Object.keys(files).forEach(path => {
    path = normalizePath(path);

    if(!path) return;

    const parts = path.split("/");
    const parent = parts.slice(0, -1).join("/");
    const name = parts[parts.length - 1];

    // 現在のフォルダ直下だけ表示
    if(parent === currentFolder){
      result.push({
        path,
        name,
        data: files[path]
      });
    }
  });

  return result.sort((a,b) => {

    // フォルダを先に表示
    if(a.data.type === "folder" && b.data.type !== "folder") return -1;
    if(a.data.type !== "folder" && b.data.type === "folder") return 1;

    return a.name.localeCompare(b.name, "ja");
  });
}

/* =========================
   名前変更
========================= */

function renameSelectedFile(){

  const old =
    selectedExplorerFile || activeFile;

  if(!old || files[old] === undefined){

    toast(
      "ファイルまたはフォルダを選択してください"
    );

    return;
  }

  const oldName =
    old.split("/").pop();

  const newName =
    prompt(
      "新しい名前",
      oldName
    );

  if(!newName || newName === oldName)
    return;

  const parent =
    old.split("/").slice(0,-1).join("/");

  const newPath =
    joinPath(parent, newName);

  if(files[newPath] !== undefined){

    toast(
      "その名前は既に使われています"
    );

    return;
  }

  /*
    フォルダの場合は中身も全部変更
  */

  if(files[old].type === "folder"){

    const prefix = old + "/";

    const children =
      Object.keys(files)
        .filter(path =>
          path.startsWith(prefix)
        );

    files[newPath] = files[old];

    children.forEach(path => {

      const relative =
        path.substring(prefix.length);

      const newChild =
        newPath + "/" + relative;

      files[newChild] =
        files[path];

      delete files[path];

    });

    delete files[old];

  }else{

    files[newPath] =
      files[old];

    delete files[old];

  }

  if(activeFile === old){

    activeFile =
      newPath;

  }

  if(selectedExplorerFile === old){

    selectedExplorerFile =
      newPath;

  }

  /*
    現在フォルダそのものを
    リネームした場合
  */

  if(currentFolder === old){

    currentFolder =
      newPath;

  }

  saveFiles();

  const ex =
    getExplorerWindow();

  if(ex){

    renderFiles(ex.id);

  }

  toast(
    "名前を変更しました"
  );
}

  )){

    return;
  }

  /*
    フォルダなら中身も削除
  */

  if(item.type === "folder"){

    const prefix =
      path + "/";

    Object.keys(files)
      .filter(x =>
        x.startsWith(prefix)
      )
      .forEach(x => {

        delete files[x];

      });
  }

  delete files[path];

  if(activeFile === path){

    activeFile = null;

  }

  selectedExplorerFile = null;

  saveFiles();

  const ex =
    getExplorerWindow();

  if(ex){

    renderFiles(ex.id);

  }

  document
    .querySelectorAll("#explorerSelected")
    .forEach(x =>
      x.textContent = "選択なし"
    );

  toast(
    name + " を削除しました"
  );
}

function openTerminal(){

  const html = `
  <div class="terminal" id="term">

    <div class="term-header">
      <span>WebOS Terminal</span>
      <span>10.0.26100</span>
    </div>

    <div id="termout" class="term-output"></div>

    <div class="term-input-line">
      <span id="termPrompt">C:\\WebOS&gt;</span>
      <input
        id="termInput"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

  </div>
  `;

  const id = makeWindow(
    'ターミナル',
    html,
    '⌨️',
    {
      width: 720,
      height: 450
    }
  );

  const w =
    document.querySelector(`#${id}`);

  const input =
    w.querySelector('#termInput');

  const out =
    w.querySelector('#termout');

  const prompt =
    w.querySelector('#termPrompt');

  let currentPath = 'C:\\WebOS';

  let history = [];
  let historyIndex = -1;

  function write(text = '', cls = ''){
    const div = document.createElement('div');

    if(cls){
      div.className = cls;
    }

    div.innerHTML = escapeHtml(text);

    out.appendChild(div);

    out.scrollTop = out.scrollHeight;
  }

  function writeHTML(html){
    out.insertAdjacentHTML(
      'beforeend',
      html
    );

    out.scrollTop =
      out.scrollHeight;
  }

  function updatePrompt(){
    prompt.textContent =
      currentPath + '>';
  }

  function runCommand(command){

    command = command.trim();

    if(!command){
      write('');
      return;
    }

    history.push(command);

    historyIndex =
      history.length;

    write(
      currentPath + '>' + command,
      'command'
    );

    input.value = '';

    // 実行中表示
    const loading =
      document.createElement('div');

    loading.className =
      'terminal-running';

    loading.textContent =
      '処理中...';

    out.appendChild(loading);

    out.scrollTop =
      out.scrollHeight;

    // 本物っぽく少し待ってから実行
    setTimeout(() => {

      loading.remove();

      termCommand(
        command,
        out,
        {
          getPath: () => currentPath,

          setPath: path => {
            currentPath = path;
            updatePrompt();
          },

          write,

          writeHTML
        }
      );

      out.scrollTop =
        out.scrollHeight;

    }, 180);
  }

  input.addEventListener(
    'keydown',
    e => {

      // Enter
      if(e.key === 'Enter'){

        runCommand(
          input.value
        );

        return;
      }

      // ↑
      if(e.key === 'ArrowUp'){

        e.preventDefault();

        if(!history.length)
          return;

        historyIndex =
          Math.max(
            0,
            historyIndex - 1
          );

        input.value =
          history[historyIndex] || '';

        return;
      }

      // ↓
      if(e.key === 'ArrowDown'){

        e.preventDefault();

        if(!history.length)
          return;

        historyIndex =
          Math.min(
            history.length,
            historyIndex + 1
          );

        input.value =
          history[historyIndex] || '';

        return;
      }

    }
  );

  // ターミナルをクリックしたら入力欄へ
  w.querySelector('.terminal')
    .addEventListener(
      'click',
      () => input.focus()
    );

  // 起動メッセージ
  write(
    'Microsoft Windows [Version 2.1.5]'
  );

  write(
    '(c) WebOS Corporation. All rights reserved.'
  );

  write('');

  write(
    'WebOS Terminal を起動しています...'
  );

  setTimeout(() => {

    write(
      'システムチェック中...'
    );

  }, 250);

  setTimeout(() => {

    write(
      'ファイルシステムを確認しました。'
    );

  }, 500);

  setTimeout(() => {

    write(
      'ターミナルの準備が完了しました。'
    );

    write('');

    updatePrompt();
    input.focus();

  }, 750);

  return id;
}

    );

    write(
      'shutdown   システムをシャットダウン'
    );

    return;
  }


  /* =========================
     dir
  ========================= */

  if(cmd === 'dir'){

    write(
      ' ドライブ C のボリューム'
    );

    write(
      ' ボリューム シリアル番号: WEBOS-10'
    );

    write('');

    const path =
      getPath()
        .replace(/^C:\\WebOS\\?/, '')
        .replace(/\\/g, '/');

    const prefix =
      path ? path + '/' : '';

    const items =
      Object.keys(files)
        .filter(x => {

          const normalized =
            x.replace(/\\/g, '/');

          if(!normalized.startsWith(prefix))
            return false;

          const rest =
            normalized.slice(
              prefix.length
            );

          return rest &&
            !rest.includes('/');
        });

    if(!items.length){

      write(
        'ファイルがありません。'
      );

    }else{

      items.forEach(name => {

        const item =
          files[name];

        if(item?.type === 'folder'){

          write(
            '<DIR>     ' + name
          );

        }else{

          write(
            '          ' + name
          );

        }

      });

    }

    write('');

    write(
      `${items.length} 個の項目`
    );

    return;
  }


  /* =========================
     pwd
  ========================= */

  if(cmd === 'pwd'){

    write(
      getPath()
    );

    return;
  }


  /* =========================
     cd
  ========================= */

  if(cmd === 'cd'){

    if(!args[0]){

      write(
        getPath()
      );

      return;
    }

    let target =
      args.join(' ');

    if(target === '..'){

      const parts =
        getPath().split('\\');

      if(parts.length > 2)
        parts.pop();

      setPath(
        parts.join('\\')
      );

      return;
    }

    if(target === '\\'){

      setPath(
        'C:\\WebOS'
      );

      return;
    }

    target =
      target
        .replace(/^C:\\WebOS\\?/i, '')
        .replace(/^\/+/, '')
        .replace(/\\/g, '/');

    const folder =
      target
        ? target
        : '';

    const exists =
      Object.keys(files)
        .some(x =>
          x.replace(/\\/g, '/') === folder &&
          files[x]?.type === 'folder'
        );

    if(!exists){

      write(
        `システムは指定されたパスを見つけられません。`
      );

      return;
    }

    setPath(
      'C:\\WebOS\\' +
      folder.replace(/\//g, '\\')
    );

    return;
  }


  /* =========================
     echo
  ========================= */

  if(cmd === 'echo'){

    write(
      args.join(' ')
    );

    return;
  }


  /* =========================
     date
  ========================= */

  if(cmd === 'date'){

    write(
      new Date()
        .toLocaleString('ja-JP')
    );

    return;
  }


  /* =========================
     whoami
  ========================= */

  if(cmd === 'whoami'){

    write(
      config.username ||
      'WebOS\\User'
    );

    return;
  }


  /* =========================
     ver
  ========================= */

  if(cmd === 'ver'){

    write(
      'WebOS [Version 2.1.5]'
    );

    return;
  }


  /* =========================
     systeminfo
  ========================= */

  if(cmd === 'systeminfo'){

    write(
      'ホスト名: WEBOS-PC'
    );

    write(
      'OS名: WebOS 10'
    );

    write(
      'OSバージョン: 10.0.26100'
    );

    write(
      'システムの種類: Web Browser'
    );

    write(
      'プロセッサ: WebOS Virtual CPU'
    );

    write(
      'メモリ: Browser Managed'
    );

    write(
      'ブラウザ: ' +
      navigator.userAgent.split(') ')[0] + ')'
    );

    return;
  }


  /* =========================
     cls / clear
  ========================= */

  if(
    cmd === 'cls' ||
    cmd === 'clear'
  ){

    out.innerHTML = '';

    return;
  }


  /* =========================
     mkdir
  ========================= */

  if(cmd === 'mkdir'){

    if(!args[0]){

      write(
        '構文: mkdir <フォルダ名>'
      );

      return;
    }

    const name =
      args.join(' ');

    const current =
      getPath()
        .replace(/^C:\\WebOS\\?/i, '')
        .replace(/\\/g, '/');

    const path =
      current
        ? current + '/' + name
        : name;

    if(files[path]){

      write(
        '既に存在します。'
      );

      return;
    }

    files[path] = {
      type: 'folder'
    };

    saveFiles();

    write(
      `フォルダを作成しました: ${name}`
    );

    return;
  }


  /* =========================
     touch
  ========================= */

  if(cmd === 'touch'){

    if(!args[0]){

      write(
        '構文: touch <ファイル名>'
      );

      return;
    }

    const name =
      args.join(' ');

    const current =
      getPath()
        .replace(/^C:\\WebOS\\?/i, '')
        .replace(/\\/g, '/');

    const path =
      current
        ? current + '/' + name
        : name;

    if(files[path]){

      write(
        'ファイルは既に存在します。'
      );

      return;
    }

    files[path] = {
      type: 'file',
      content: ''
    };

    saveFiles();

    write(
      `ファイルを作成しました: ${name}`
    );

    return;
  }


  /* =========================
     cat
  ========================= */

  if(cmd === 'cat'){

    if(!args[0]){

      write(
        '構文: cat <ファイル名>'
      );

      return;
    }

    const name =
      args.join(' ');

    const current =
      getPath()
        .replace(/^C:\\WebOS\\?/i, '')
        .replace(/\\/g, '/');

    const path =
      current
        ? current + '/' + name
        : name;

    if(!files[path]){

      write(
        'ファイルが見つかりません。'
      );

      return;
    }

    if(files[path].type === 'folder'){

      write(
        '指定されたパスはファイルではありません。'
      );

      return;
    }

    const content =
      files[path].content || '';

    content
      .split('\n')
      .forEach(line =>
        write(line)
      );

    return;
  }


  /* =========================
     open
  ========================= */

  if(cmd === 'open'){

    if(!args[0]){

      write(
        '構文: open <ファイル名>'
      );

      return;
    }

    const name =
      args.join(' ');

    write(
      `ファイルを開いています: ${name}`
    );

    setTimeout(() => {

      openFile(name);

    }, 250);

    return;
  }


  /* =========================
     rm
  ========================= */

  if(cmd === 'rm'){

    if(!args[0]){

      write(
        '構文: rm <ファイル名>'
      );

      return;
    }

    const name =
      args.join(' ');

    if(!files[name]){

      write(
        'ファイルが見つかりません。'
      );

      return;
    }

    delete files[name];

    saveFiles();

    write(
      `削除しました: ${name}`
    );

    return;
  }


  /* =========================
     lock
  ========================= */

  if(cmd === 'lock'){

    write(
      'WebOSをロックしています...'
    );

    setTimeout(
      () => lock(),
      300
    );

    return;
  }

  /* =========================
   restart
========================= */

if(cmd === 'restart'){

  write(
    'WebOSを再起動しています...'
  );

  setTimeout(() => {

    restart();

  }, 500);

  return;
}
  /* =========================
     shutdown
  ========================= */

  if(cmd === 'shutdown'){

    write(
      'システムをシャットダウンしています...'
    );

    setTimeout(
      () => shutdown(),
      500
    );

    return;
  }


  /* =========================
     unknown
  ========================= */

  write(
    `'${cmd}' は、内部コマンドまたは外部コマンドとして認識されていません。`
  );
}

function tmShowTab(button, tab){

function refreshTaskManager(winId){

  const manager = document.getElementById(winId);
  if(!manager) return;

  const list = manager.querySelector('#tmList');
  if(!list) return;

  // 現在チェックされているタスクを保存
  const checkedIds = new Set(
    [...list.querySelectorAll('.tm-check:checked')]
      .map(cb => cb.dataset.id)
  );

  list.innerHTML = '';

  const rows = Object.values(windowsMap);

  rows.forEach(o => {

    const row = document.createElement('div');

    row.className = 'tm-row';
    row.dataset.id = o.id;

    const cpu =
      Math.floor(Math.random() * 8);

    const memory =
      (Math.random() * 4 + 1).toFixed(1);

    row.innerHTML = `
      <input
        type="checkbox"
        class="tm-check"
        data-id="${o.id}"
        title="このタスクを選択"
      >

      <span class="tm-app-name">
        <span class="tm-icon">
          ${o.icon}
        </span>

        ${escapeHtml(o.title)}
      </span>

      <span>
        <span class="tm-running">
          ● 実行中
        </span>
      </span>

      <span>
        ${cpu}%
      </span>

      <span>
        ${memory} MB
      </span>
    `;

    const checkbox =
      row.querySelector('.tm-check');

    // 以前チェックされていたタスクなら復元
    if(checkedIds.has(o.id)){
      checkbox.checked = true;
    }

    // チェックボックス操作では行クリックを発生させない
    checkbox.addEventListener('click', e => {
      e.stopPropagation();
    });

    // 行クリック
    row.addEventListener('click', e => {

      if(e.target === checkbox) return;

      focusWindow(o.id);

    });

    list.appendChild(row);

  });

  if(rows.length === 0){

    list.innerHTML = `
      <div class="tm-empty">
        実行中のアプリはありません。
      </div>
    `;

  }

}

function tmEndSelected(){

  const manager =
    [...document.querySelectorAll('.window')]
      .find(w => w.querySelector('#tmList'));

  if(!manager) return;

  const checked =
    [...manager.querySelectorAll('.tm-check:checked')];

  if(checked.length === 0){
    toast('終了するタスクを選択してください');
    return;
  }

  const targets = checked
    .map(cb => windowsMap[cb.dataset.id])
    .filter(Boolean);

  if(targets.length === 0) return;

  const names = targets
    .map(t => t.title)
    .join('、');

  if(!confirm(
    targets.length === 1
      ? `「${names}」を終了しますか？`
      : `${targets.length} 個のタスクを終了しますか？\n\n${names}`
  )){
    return;
  }

  // タスクマネージャー自身が選択されているか確認
  const managerWillClose =
    targets.some(t => t.id === manager.id);

  // 選択されたタスクをすべて終了
  targets.forEach(target => {
    closeWindow(target.id);
  });

  // タスクマネージャー自身を終了した場合は
  // ここで処理を終了する
  if(managerWillClose){
    toast('タスクを終了しました');
    return;
  }

  // タスクマネージャーが残っている場合だけ更新
  setTimeout(() => {

    if(!windowsMap[manager.id]) return;

    refreshTaskManager(manager.id);
    refreshTaskDetails(manager.id);
    updateTaskManagerStats(manager.id);

  }, 20);

  toast(
    targets.length === 1
      ? 'タスクを終了しました'
      : `${targets.length} 個のタスクを終了しました`
  );
}

    w.querySelector('#browserFrame');

  const status =
    w.querySelector('#browserStatus');

  let value =
    input.value.trim();

  if(!value) return;


  // WebOSホーム
  if(value === 'webos://home'){

    browserHome();
    return;
  }


  // URL
  if(/^https?:\/\//i.test(value)){

    status.textContent =
      '読み込み中: ' + value;

    browserHistory.push(value);
    browserFuture.length = 0;

    frame.src = value;

    return;
  }


  // localhost
  if(
    /^localhost(:\d+)?(\/.*)?$/i.test(value)
  ){

    value = 'http://' + value;

    input.value = value;

    status.textContent =
      '読み込み中: ' + value;

    frame.src = value;

    browserHistory.push(value);
    browserFuture.length = 0;

    return;
  }


  // 検索
  const search =
    'https://www.google.com/search?q=' +
    encodeURIComponent(value);

  input.value = search;

  status.textContent =
    '検索: ' + value;

  frame.src = search;

  browserHistory.push(search);
  browserFuture.length = 0;
}


function browserBack(){

  const w = getBrowser();

  if(!w) return;

  const frame =
    w.querySelector('#browserFrame');

  try{

    frame.contentWindow.history.back();

  }catch{

    if(browserHistory.length > 1){

      browserHistory.pop();

      const previous =
        browserHistory[browserHistory.length - 1];

      frame.src = previous;

    }

  }
}


function browserForward(){

  const w = getBrowser();

  if(!w) return;

  const frame =
    w.querySelector('#browserFrame');

  try{

    frame.contentWindow.history.forward();

  }catch{

    if(browserFuture.length){

      const next =
        browserFuture.pop();

      frame.src = next;

    }

  }
}


function browserReload(){

  const w = getBrowser();

  if(!w) return;

  const frame =
    w.querySelector('#browserFrame');

  try{

    frame.contentWindow.location.reload();

  }catch{

    frame.src = frame.src;

  }

}

/* ==========================================================
   独自JavaScript API
   テキストエディターから使えるAPI:
   OS.window(title, html, options)
   OS.close(id)
   OS.toast(text)
   OS.openApp(name)
   OS.writeFile(name,text)
   OS.readFile(name)
   OS.listFiles()
   OS.lock()
   ========================================================== */
window.OS = {

  window(title, html, options = {}) {
    return makeWindow(
      title,
      html,
      "🧩",
      options
    );
  },

  close(id) {
    closeWindow(id);
  },

  toast,

  openApp,

  lock,

  mkdir(path) {

    path = normalizePath(path);

    if(!path) return false;

    if(files[path] !== undefined)
      return false;

    files[path] = {
      type: "folder"
    };

    saveFiles();

    return true;
  },

  writeFile(name, text) {

    name = normalizePath(name);

    files[name] = {
      type: "file",
      content: String(text)
    };

    saveFiles();

    return true;
  },

  readFile(name) {

    name = normalizePath(name);

    if(!files[name])
      return null;

    if(files[name].type !== "file")
      return null;

    return files[name].content;
  },

  delete(path) {

    path = normalizePath(path);

    if(!files[path])
      return false;

    if(files[path].type === "folder"){

      const prefix =
        path + "/";

      Object.keys(files)
        .filter(x =>
          x.startsWith(prefix)
        )
        .forEach(x =>
          delete files[x]
        );
    }

    delete files[path];

    saveFiles();

    return true;
  },

  listFiles() {

    return Object.keys(files);
  },

  listFolder(folder = "") {

  folder = normalizePath(folder);

  const result = [];

  Object.keys(files).forEach(path => {

    const parts = path.split("/");
    const parent = parts.slice(0,-1).join("/");

    if(parent !== folder)
      return;

    result.push({
      name: parts[parts.length - 1],
      path: path,
      type: files[path].type
    });

  });

  return result;
},

  html(s) {

    return escapeHtml(s);

  }

};

const trashStorageKey = 'webos14_desktop_trash_v1';
let desktopTrash = JSON.parse(localStorage.getItem(trashStorageKey) || '[]');
function saveDesktopTrash(){
  localStorage.setItem(trashStorageKey, JSON.stringify(desktopTrash));
}
function getDesktopIconMeta(el){
  return {
    app: el.dataset.app,
    icon: el.querySelector('.ico')?.textContent || '📄',
    name: el.querySelector('span:last-child')?.textContent || el.dataset.app || '項目'
  };
}
function openTrash(){
  const d=document.getElementById('trashDialog');
  if(!d)return;
  renderTrash();
  d.classList.add('show');
}
function closeTrash(){
  document.getElementById('trashDialog')?.classList.remove('show');
}
function renderTrash(){
  const list=document.getElementById('trashList');
  if(!list)return;
  list.innerHTML='';
  if(!desktopTrash.length){
    list.innerHTML='<div class="trash-empty">ゴミ箱は空です</div>';
    return;
  }
  desktopTrash.forEach((item,index)=>{
    const row=document.createElement('div');
    row.className='trash-item';
    row.innerHTML=`<div class="trash-item-icon">${escapeHtml(item.icon)}</div><div class="trash-item-name">${escapeHtml(item.name)}</div><button>復元</button>`;
    row.querySelector('button').onclick=()=>restoreDesktopIcon(index);
    list.appendChild(row);
  });
}
function restoreDesktopIcon(index){
  const item = desktopTrash[index];
  if(!item) return;

  const icons = document.getElementById('desktopIcons');
  if(!icons) return;

  const el = document.createElement('div');

  el.className = 'icon';
  el.dataset.app = item.app;

  el.ondblclick = () => openApp(item.app);

  el.innerHTML = `
    <div class="ico">${escapeHtml(item.icon)}</div>
    <span>${escapeHtml(item.name)}</span>
  `;

  icons.appendChild(el);

  /*
   * 復元したアプリの保存済み座標を削除
   * → initOneDesktopIcon() がデフォルト位置を設定する
   */
  delete desktopPositions[item.app];

  /*
   * 新しい位置を保存
   */
  saveDesktopPositions();

  /*
   * ゴミ箱から削除
   */
  desktopTrash.splice(index, 1);
  saveDesktopTrash();

  /*
   * デフォルト位置で初期化
   */
  initOneDesktopIcon(el);

  renderTrash();

  toast(item.name + ' を復元しました');
}
function moveDesktopIconToTrash(el){
  if(!el || el.dataset.trash==='true')return;
  const item=getDesktopIconMeta(el);
  const existing=desktopTrash.find(x=>x.app===item.app && x.name===item.name);
  if(!existing)desktopTrash.push(item);
  saveDesktopTrash();
  el.remove();
  const trash=document.getElementById('trashIcon');
  trash?.classList.remove('drag-over');
}

const desktopPositionsKey='webos10_desktop_positions_v1';
let desktopPositions=JSON.parse(localStorage.getItem(desktopPositionsKey)||'null')||{};
function saveDesktopPositions(){localStorage.setItem(desktopPositionsKey,JSON.stringify(desktopPositions))}
function initOneDesktopIcon(el){
  const key = el.dataset.app;
  if(!key) return;

  // ホーム画面の初期配置
  const positions = {
  // 1行目
  explorer:    {x: 12,  y: 106},
  editor:      {x: 12, y: 200},
  terminal:    {x: 90, y: 106},
  calculator:  {x: 12, y: 294},

  // 2行目
  browser:     {x: 12,  y: 388},
  taskmgr:     {x: 90,  y: 12},
  settings:    {x: 90,  y: 200}
};

// 保存済みの位置がなければ初期位置を使用
if(!desktopPositions[key] && positions[key]){
  desktopPositions[key] = positions[key];
}

  // 念のため位置がないアイコンは左上に配置
  if(!desktopPositions[key]){
    desktopPositions[key] = {x: 12, y: 12};
  }

  applyIconPosition(el);

  let dragging = false;
  let dx = 0;
  let dy = 0;

  el.addEventListener('mousedown', e => {
    if(e.button !== 0 || el.dataset.trash === 'true') return;

    dragging = true;

    const r = el.getBoundingClientRect();

    dx = e.clientX - r.left;
    dy = e.clientY - r.top;

    el.style.zIndex = 20;

    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if(!dragging) return;

    const trash = document.getElementById('trashIcon');
    const tr = trash?.getBoundingClientRect();

    if(
      tr &&
      e.clientX >= tr.left &&
      e.clientX <= tr.right &&
      e.clientY >= tr.top &&
      e.clientY <= tr.bottom
    ){
      trash.classList.add('drag-over');
    }else{
      trash?.classList.remove('drag-over');
    }

    const d = desktopPositions[key];

    d.x = Math.max(
      0,
      Math.min(innerWidth - 90, e.clientX - dx)
    );

    d.y = Math.max(
      0,
      Math.min(innerHeight - 100, e.clientY - dy)
    );

    applyIconPosition(el);
  });

  document.addEventListener('mouseup', e => {
    if(!dragging) return;

    dragging = false;

    const trash = document.getElementById('trashIcon');
    const tr = trash?.getBoundingClientRect();

    const over =
      tr &&
      e.clientX >= tr.left &&
      e.clientX <= tr.right &&
      e.clientY >= tr.top &&
      e.clientY <= tr.bottom;

    trash?.classList.remove('drag-over');

    if(over){
      moveDesktopIconToTrash(el);
    }else{
      saveDesktopPositions();
    }
  });
}
function initDesktopIcons(){
 document.querySelectorAll('.icon[data-app]').forEach(initOneDesktopIcon);
}

function applyIconPosition(el){
 const p=desktopPositions[el.dataset.app];
 el.style.left=p.x+'px';el.style.top=p.y+'px';
}
window.addEventListener('resize',()=>{
 document.querySelectorAll('.icon').forEach(applyIconPosition)
});

let ctrlAltTriggered = false;

document.addEventListener('keydown', function(e){

  // Windowsキー
  if(e.key === 'Meta' || e.key === 'OS'){

    e.preventDefault();

    if(!e.repeat){
      toggleStart();
    }

    return;
  }

  // Ctrl + Alt
  if(e.ctrlKey && e.altKey){

    e.preventDefault();

    if(!ctrlAltTriggered){

      ctrlAltTriggered = true;

      toggleStart();

    }

  }

});

document.addEventListener('keyup', function(e){

  if(
    e.key === 'Control' ||
    e.key === 'Alt'
  ){

    ctrlAltTriggered = false;

  }

});
